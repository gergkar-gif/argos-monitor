# Ukraine source registry (decision D15).
# Combines statutory national agency & executive portal (Ukrinform, Cabinet of Ministers), public broadcasters
# (Suspilne, BBC News Ukrainian, Radio Svoboda, Krym.Realii), independent wires (Interfax-Ukraine, UNIAN, UNN),
# premier political, investigative & defense press (Ukrainska Pravda, The Kyiv Independent, Kyiv Post, NV,
# Euromaidan Press, LB.ua, ZN.UA, Babel, Hromadske, Bihus.Info, Slidstvo.Info, Texty.org.ua, Detector Media,
# Militarnyi, European Pravda, Rubryka), and commercial dailies (Espreso TV, Fakty, Glavred, 24 Kanal, RBC-Ukraine,
# Censor.net, Forbes Ukraine, LIGA.net, TSN).

sources:
  - id: ukrinform_en
    name: Ukrinform (English)
    homepage: https://www.ukrinform.net
    language: en
    scope: domestic
    kind: official
    governing_body: Ministry of Culture and Strategic Communications of Ukraine (statutory state wire)
    state_affiliated: true
    feeds:
      - {url: "https://www.ukrinform.net/rss/block-lastnews", section: Wire, category_hint: general}

