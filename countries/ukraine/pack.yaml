classify:
  internal_politics:
  - President Volodymyr Zelenskyy, Office of the President (Andriy Yermak), Verkhovna Rada (Parliament), government cabinet (Denys Shmyhal), anti-corruption agencies (NABU, SAPO, HACC), martial law governance
  - Володимир Зеленський, Офіс Президента, Верховна Рада, Кабінет Міністрів, Денис Шмигаль, НАБУ, САП, ВАКС, воєнний стан, вибори, уряд, політика
  economics:
  - National Bank of Ukraine (NBU), state budget and Western financial aid, IMF loans, grain corridor export, Black Sea maritime shipping, energy infrastructure repairs (Ukrenergo, DTEK, Naftogaz), hryvnia rate
  - Національний банк України, НБУ, держбюджет, фінансова допомога, МВФ, експорт зерна, чорноморський коридор, енергетика, Укренерго, ДТЕК, Нафтогаз, гривня, відключення світла
  foreign_policy:
  - Peace formula diplomacy, peace summits, European Union accession talks, NATO integration and bilateral security agreements, Foreign Minister Andrii Sybiha, relations with US, Poland, Germany, UK, France, Hungary
  - Формула миру, саміт миру, вступ до ЄС, інтеграція в НАТО, безпекові угоди, Андрій Сибіга, США, Польща, Німеччина, Велика Британія, Угорщина, дипломатія
  defence_security:
  - Armed Forces of Ukraine (ZSU), Commander-in-Chief Oleksandr Syrskyi, Kyrylo Budanov, frontline battles (Pokrovsk, Kupiansk, Kursk), Western weapons (Patriot, F-16, ATACMS), drone warfare, defense industry Ukroboronprom
  - Генеральний штаб ЗСУ, Олександр Сирський, Кирило Буданов, фронт, бойові дії, Покровськ, Куп'янськ, Курська операція, ППО Patriot, винищувачі F-16, далекобійні удари, дрони, БпЛА, Укроборонпром
  society:
  - Internally displaced persons (IDPs), refugees, civilian war casualties, power outages, winter heating, medical rehabilitation of wounded veterans, wartime schooling
  - Переселенці, біженці, цивільні втрати, відключення світла, опалювальний сезон, ветерани, реабілітація, охорона здоров'я, освіта
