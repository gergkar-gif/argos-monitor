# Ukraine's additions to the shared themes (../../themes.yaml).
themes:
  - id: party_gov
    label: Wartime Governance, Presidential Administration & Anti-Corruption
    weight: 1.0
    category: internal_politics
    describe:
      - President Volodymyr Zelenskyy, Office of the President under Andriy Yermak, cabinet of ministers led by Denys Shmyhal, Verkhovna Rada legislation, anti-corruption enforcement by NABU and SAPO
      - Володимир Зеленський, Офіс Президента, Андрій Єрмак, Денис Шмигаль, уряд, Верховна Рада, НАБУ, САП, антикорупція, воєнний стан
    keywords: ["зеленський", "zelensky", "zelenskyy", "єрмак", "yermak", "шмигаль", "shmyhal", "рада", "уряд", "набу", "сап", "корупція", "воєнний стан"]

  - id: defence_security
    label: Frontline Operations, Air Defense & Long-Range Strikes
    weight: 1.0
    category: defence_security
    describe:
      - General Staff operations under Commander Oleksandr Syrskyi, battles in Pokrovsk, Kupiansk, Toretsk, and Kursk, air defense against missile and drone barrages (Patriot, NASAMS), long-range strikes
      - Генеральний штаб, Олександр Сирський, бойові дії, фронт, Покровськ, Куп'янськ, Курськ, ППО Patriot, далекобійні удари, дрони, зброя
    keywords: ["зсу", "сирський", "syrskyi", "покровськ", "pokrovsk", "куп'янськ", "курськ", "kursk", "фронт", "ппо", "patriot", "ракет", "дрон", "атака", "зброя"]

  - id: diplomacy
    label: Peace Formula, EU Accession, Transcarpathia Minority Rights & Neighbour Relations
    weight: 1.0
    category: foreign_policy
    describe:
      - Ukraine peace formula, European Union accession negotiations, national minority language and education rights in Transcarpathia (Zakarpattia / Uzhhorod), bilateral relations with Hungary, Slovakia, Poland, and NATO allies
      - Формула миру, переговори про вступ до ЄС, права національних меншин, Закарпаття, Ужгород, угорська меншина, безпекові угоди, НАТО, США, Польща, Угорщина, Словаччина
    keywords: ["формула миру", "peace formula", "єс", "nato", "нато", "євросоюз", "саміт", "допомога", "союзник", "дипломат", "закарпаття", "ужгород", "нацменшин", "угорщин", "transcarpathia", "zakarpattia"]

  - id: energy_econ
    label: Energy Grid Resilience, Druzhba / Gas Transit, Black Sea Shipping & Reconstruction
    weight: 1.0
    category: economics
    describe:
      - Restoration of power grid after Russian strikes (Ukrenergo, DTEK, Energoatom), cross-border electricity imports from Central Europe, Druzhba oil pipeline and natural gas transit to Hungary and Slovakia, Black Sea maritime export corridor, and IMF budget financing
      - Енергосистема, Укренерго, ДТЕК, Енергоатом, блекаут, нафтопровід Дружба, транзит газу, зерновий коридор, Чорне море, експорт, МВФ, бюджет
    keywords: ["укренерго", "дтек", "енергоатом", "енергет", "блекаут", "світло", "дружба", "транзит газу", "лукойл", "експорт", "зерно", "чорне море", "мвф", "бюджет", "гривня", "druzhba"]
