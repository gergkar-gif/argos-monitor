# Cyprus source registry (decision D15).
# Combines statutory state wire (CNA / ΚΥΠΕ) and public broadcaster (CyBC / RIK via GN) with leading Greek-Cypriot broadsheets
# and portals (Philenews / Phileleftheros, Politis, Kathimerini Cyprus, Dialogos, SigmaLive, AlphaNews, Reporter, Offsite),
# English-language dailies and financial press (Cyprus Mail, In-Cyprus, StockWatch, Financial Mirror, Nomisma), and
# Turkish-Cypriot northern press (Kıbrıs Gazetesi, Kıbrıs Postası, Yenidüzen, Gazedda Kıbrıs, Havadis).

sources:
  - id: cna_cy
    name: Cyprus News Agency (CNA / ΚΥΠΕ)
    homepage: https://www.cna.org.cy
    language: el
    scope: domestic
    kind: official
    aggregator: google_news
    governing_body: Κυπριακό Πρακτορείο Ειδήσεων (statutory national news wire of the Republic of Cyprus)
    state_affiliated: true
    feeds:
      - {url: "https://news.google.com/rss/search?q=site:cna.org.cy+when:3d&hl=el&gl=GR&ceid=GR:el", section: ΚΥΠΕ, category_hint: general}

  - id: philenews_cy
    name: Phileleftheros (Philenews)
    homepage: https://www.philenews.com
    language: el
    scope: domestic
    kind: media
    governing_body: Phileleftheros Public Company Ltd (Nicosia — Cyprus's oldest and largest-circulation Greek-language daily newspaper of record)
    state_affiliated: false
    feeds:
      - {url: "https://www.philenews.com/feed/", section: Ειδήσεις, category_hint: internal_politics}

  - id: politis_cy
    name: Politis (Πολίτης)
    homepage: https://politis.com.cy
    language: el
    scope: domestic
    kind: media
    governing_body: Politis Press Ltd (Nicosia — major independent investigative and political daily newspaper)
    state_affiliated: false
    feeds:
      - {url: "https://www.politis.com.cy/feed/", section: Κύπρος, category_hint: internal_politics}

  - id: dialogos_cy
    name: Dialogos (Διάλογος)
    homepage: https://dialogos.com.cy
    language: el
    scope: domestic
    kind: media
    governing_body: Dialogos Media Group (Nicosia — left-wing political daily portal covering Parliament, bicommunal talks, and labour)
    state_affiliated: false
    feeds:
      - {url: "https://dialogos.com.cy/feed/", section: Πολιτική, category_hint: internal_politics}

  - id: cyprusmail_cy
    name: Cyprus Mail
    homepage: https://cyprus-mail.com
    language: en
    scope: domestic
    kind: media
    governing_body: Cyprus Mail Co Ltd (Nicosia — premier English-language daily newspaper in Cyprus founded in 1945)
    state_affiliated: false
    feeds:
      - {url: "https://cyprus-mail.com/feed", section: Cyprus News, category_hint: general}

  - id: nomisma_cy
    name: Nomisma.com.cy
    homepage: https://nomisma.com.cy
    language: el
    scope: domestic
    kind: media
    governing_body: Nomisma Media (Cypriot economic, fiscal policy, banking, and maritime business portal)
    state_affiliated: false
    feeds:
      - {url: "https://nomisma.com.cy/feed/", section: Οικονομία, category_hint: economics}

  - id: financialmirror_cy
    name: Financial Mirror
    homepage: https://www.financialmirror.com
    language: en
    scope: domestic
    kind: media
    governing_body: Financial Mirror Media Ltd (English-language business, shipping, and East Med energy weekly in Nicosia)
    state_affiliated: false
    feeds:
      - {url: "https://www.financialmirror.com/feed/", section: Business & Economy, category_hint: economics}

  - id: yeniduzen_cy
    name: Yenidüzen
    homepage: https://www.yeniduzen.com
    language: tr
    scope: domestic
    kind: media
    governing_body: Yenidüzen Newspaper (independent pro-reunification Turkish-Cypriot daily in Nicosia)
