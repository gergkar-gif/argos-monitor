    language: el
    scope: domestic
    kind: media
    aggregator: google_news
    governing_body: SPP Media Group (Cypriot edition of the broadsheet paper of record covering diplomacy, energy, and governance)
    state_affiliated: false
    feeds:
      - {url: "https://news.google.com/rss/search?q=site:kathimerini.com.cy+when:3d&hl=el&gl=GR&ceid=GR:el", section: Πολιτική & Οικονομία, category_hint: internal_politics}

  - id: gnews_cy_greek_press
    name: SigmaLive / AlphaNews / Reporter / Offsite / OmegaLive / RIK (via Google News)
    homepage: https://www.sigmalive.com
    language: el
    scope: domestic
    kind: media
    aggregator: google_news
    governing_body: Dias Media / Alpha TV Cyprus / IMH / Offsite / Omega / CyBC RIK
    state_affiliated: false
    feeds:
      - {url: "https://news.google.com/rss/search?q=(site:sigmalive.com+OR+site:alphanews.live+OR+site:reporter.com.cy+OR+site:offsite.com.cy+OR+site:omegalive.com.cy+OR+site:brief.com.cy+OR+site:riknews.com.cy)+when:3d&hl=el&gl=GR&ceid=GR:el", section: Κυπριακά ΜΜΕ, category_hint: general}

  - id: gnews_cy_en_press
    name: In-Cyprus / StockWatch Cyprus (via Google News)
    homepage: https://in-cyprus.philenews.com
    language: en
    scope: domestic
