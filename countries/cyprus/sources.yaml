  - id: kibrispostasi_cy
    name: Kıbrıs Postası / Havadis Kıbrıs (Turkish Cypriot via Google News)
    homepage: https://www.kibrispostasi.com
    language: tr
    scope: domestic
    kind: media
    aggregator: google_news
    governing_body: Kıbrıs Postası Media / Havadis Gazetesi
    state_affiliated: false
    feeds:
      - {url: "https://news.google.com/rss/search?q=(site:kibrispostasi.com+OR+site:havadiskibris.com)+when:3d&hl=tr&gl=TR&ceid=TR:tr", section: Kıbrıs, category_hint: internal_politics}

  - id: gnews_en_cy
    name: Google News (Cyprus - International)
    homepage: https://news.google.com
    language: en
    scope: international
    kind: media
    aggregator: google_news
    governing_body: n/a (aggregator)
    state_affiliated: false
    feeds:
      - {url: "https://news.google.com/rss/search?q=Cyprus+(Nicosia+OR+Christodoulides+OR+UNFICYP+OR+%22East+Med%22+OR+gas+OR+EU)+when:7d&hl=en-US&gl=US&ceid=US:en", section: Cyprus geopolitics & energy, category_hint: foreign_policy}
