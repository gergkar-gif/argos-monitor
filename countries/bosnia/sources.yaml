# Bosnia and Herzegovina source registry (decision D15).
# Combines investigative & national Bosnian outlets (Center for Investigative Reporting CIN, Oslobođenje, Klix.ba, Istraga.ba), state wire FENA / public broadcaster via Google News, regional Balkan outlets (Al Jazeera Balkans, RFE/RL Slobodna Evropa), and international wires.

sources:
  - id: cin_ba
    name: Center for Investigative Reporting (CIN)
    homepage: https://www.cin.ba
    language: bs
    scope: domestic
    kind: media
    governing_body: Centar za istraživačko novinarstvo (Sarajevo independent investigative center)
    state_affiliated: false
    feeds:
      - {url: "https://www.cin.ba/feed/", section: Istraživanja, category_hint: general}

  - id: oslobodjenje_ba
    name: Oslobođenje
    homepage: https://www.oslobodjenje.ba
    language: bs
    scope: domestic
    kind: media
    governing_body: Oslobođenje d.o.o. (Sarajevo daily paper of record)
    state_affiliated: false
    feeds:
      # Direct RSS 404 after Next.js migration; covered reliably via Google News aggregator below
      - {url: "https://www.oslobodjenje.ba/feed", section: Vijesti, category_hint: general, active: false}

  - id: istraga_ba
    name: Istraga.ba
    homepage: https://istraga.ba
    language: bs
    scope: domestic
    kind: media
    governing_body: Istraga.ba (Sarajevo independent investigative and political portal)
    state_affiliated: false
    feeds:
      - {url: "https://istraga.ba/feed/", section: Politika, category_hint: internal_politics}

  - id: gnews_ba_domestic
    name: Klix.ba / Dnevni Avaz / Nezavisne / Oslobođenje (National Press via Google News)
    homepage: https://www.klix.ba
    language: bs
    scope: domestic
    kind: media
    aggregator: google_news
    governing_body: InterSoft d.o.o. / Avaz-roto press / NIGD Dnevne nezavisne novine / Oslobođenje
    state_affiliated: false
    feeds:
      - {url: "https://news.google.com/rss/search?q=(site:klix.ba+OR+site:avaz.ba+OR+site:nezavisne.com+OR+site:oslobodjenje.ba)+when:1d&hl=bs&gl=BA&ceid=BA:bs", section: Vijesti, category_hint: general}

  - id: gnews_ba_official
    name: FENA / RTRS / BHRT (State Wire & Public Broadcasters via Google News)
    homepage: https://fena.ba
    language: bs
    scope: domestic
    kind: official
    aggregator: google_news
    governing_body: Federal News Agency (FENA) & Radio Television of Republika Srpska (RTRS) / BHRT
    state_affiliated: true
    feeds:
      - {url: "https://news.google.com/rss/search?q=(site:fena.ba+OR+site:rtrs.tv+OR+site:bhrt.ba)+when:7d&hl=bs&gl=BA&ceid=BA:bs", section: Zvanično, category_hint: general}

  - id: gnews_ba_abroad
    name: Al Jazeera Balkans / Slobodna Evropa (Regional Press)
    homepage: https://balkans.aljazeera.net
    language: bs
    scope: abroad_local
    kind: media
    aggregator: google_news
    governing_body: Al Jazeera Media Network / Radio Free Europe
    state_affiliated: false
    feeds:
      - {url: "https://news.google.com/rss/search?q=(site:balkans.aljazeera.net+OR+site:slobodnaevropa.org)+(Bosna+OR+Dodik+OR+Sarajevo)+when:7d&hl=sr&gl=RS&ceid=RS:sr", section: Regija, category_hint: general}

  - id: gnews_en_ba
    name: Google News (Bosnia - International)
    homepage: https://news.google.com
    language: en
    scope: international
    kind: media
    aggregator: google_news
    governing_body: n/a (aggregator)
    state_affiliated: false
    feeds:
      - {url: "https://news.google.com/rss/search?q=Bosnia+(Sarajevo+OR+Dodik+OR+%22Republika+Srpska%22+OR+OHR+OR+Schmidt)+when:1d&hl=en-US&gl=US&ceid=US:en", section: Bosnia politics & Dayton, category_hint: internal_politics}
      - {url: "https://news.google.com/rss/search?q=Bosnia+(EU+OR+NATO+OR+EUFOR+OR+Balkans)+when:1d&hl=en-US&gl=US&ceid=US:en", section: Bosnia EU & security, category_hint: foreign_policy}
