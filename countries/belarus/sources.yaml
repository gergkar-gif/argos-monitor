# Belarus source registry (decision D15).
# Combines statutory regime wire (BelTA) with leading exiled independent & regional Belarusian outlets
# (Zerkalo.io, Nasha Niva, Charter'97, REFORM.news, Euroradio, Radio Svaboda, Belsat, Pozirk, Salidarnasts / GazetaBy,
# Radio Racyja, Hrodna.life, MOST, BGMedia, UDF.by, Plan B Media, dev.by, CityDog.io, Viasna / Spring96).

sources:
  - id: belta_ru
    name: BelTA (Russian)
    homepage: https://www.belta.by
    language: ru
    scope: domestic
    kind: official
    governing_body: Presidential Administration of Belarus (statutory state wire)
    state_affiliated: true
    feeds:
      - {url: "https://belta.by/rss/", section: Новости, category_hint: internal_politics}

  - id: belta_en
    name: BelTA (English)
    homepage: https://eng.belta.by
    language: en
    scope: domestic
    kind: official
    aggregator: google_news
    governing_body: Presidential Administration of Belarus (statutory state wire)
    state_affiliated: true
    feeds:
      - {url: "https://news.google.com/rss/search?q=site:eng.belta.by+when:7d&hl=en-US&gl=US&ceid=US:en", section: English, category_hint: internal_politics}

