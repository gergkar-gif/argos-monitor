# Israel editorial policy priority themes.
# High-weight themes for foreign-affairs analysts and diplomatic observers.

themes:
  - id: knesset_coalition_wartime_governance
    label: "Wartime Coalition & Knesset Politics"
    weight: 1.0
    keywords:
      - "netanyahu"
      - "knesset"
      - "coalition"
      - "haredi draft"
      - "conscription"
      - "ben-gvir"
      - "smotrich"
      - "attorney general"
      - "opposition"
    description: "Netanyahu government stability, ultra-Orthodox draft exemption controversy, budget approvals, and ministerial tensions."

  - id: multi_front_military_operations
    label: "Multi-Front Defense Operations & Deterrence"
    weight: 0.95
    keywords:
      - "idf"
      - "iron dome"
      - "david's sling"
      - "arrow"
      - "hezbollah"
      - "lebanon"
      - "gaza"
      - "iran deterrence"
      - "iaf"
      - "airstrike"
    description: "IDF ground and air operations, missile defense interceptions against ballistic attacks, targeted strikes, and deterrence."

