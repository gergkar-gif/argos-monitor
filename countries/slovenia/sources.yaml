# Slovenia source registry (decision D15).
# Combines statutory public broadcaster (RTV Slovenija) and state wire (STA via Google News) with leading national broadsheets (Delo, Dnevnik, Večer), financial daily (Finance.si), and investigative/digital portals (N1 Slovenija, 24ur, Siol.net, Mladina, Necenzurirano, Domovina, Žurnal24).

sources:
  - id: rtvslo_si
    name: RTV Slovenija (MMC)
    homepage: https://www.rtvslo.si
    language: sl
    scope: domestic
    kind: official
    governing_body: Radiotelevizija Slovenija (statutory national public-service broadcaster)
    state_affiliated: false
    feeds:
      - {url: "https://img.rtvslo.si/feeds/00.xml", section: Vse новице, category_hint: general}
      - {url: "https://img.rtvslo.si/feeds/01.xml", section: Slovenija, category_hint: internal_politics}
      - {url: "https://img.rtvslo.si/feeds/06.xml", section: Gospodarstvo, category_hint: economics}

  - id: sta_si
    name: STA (Slovenian Press Agency)
    homepage: https://www.sta.si
    language: sl
    scope: domestic
    kind: official
    aggregator: google_news
    governing_body: Slovenska tiskovna agencija (statutory national news wire)
    state_affiliated: true
    feeds:
      - {url: "https://news.google.com/rss/search?q=site:sta.si+when:7d&hl=sl&gl=SI&ceid=SI:sl", section: STA, category_hint: general}

