# Malta source registry (decision D15).
# Combines public broadcaster (TVMnews / PBS) with national papers of record (Times of Malta, MaltaToday, The Malta
# Independent, Newsbook), investigative outlets (The Shift News, The Journal.mt), party/broadcast portals (NET News,
# ONE News), bilingual weeklies (Illum, Lovin Malta), and financial press (Who's Who.mt, BusinessNow.mt, The Malta Business Weekly).
sources:
- id: tvm_mt
  name: TVMnews (Television Malta)
  homepage: https://tvmnews.mt
  language: en
  scope: domestic
  kind: official
  aggregator: google_news
  governing_body: Public Broadcasting Services Ltd (PBS — statutory national public broadcaster of Malta)
  state_affiliated: false
  feeds:
  - url: https://news.google.com/rss/search?q=site:tvmnews.mt+when:3d&hl=en-US&gl=US&ceid=US:en
    section: News
    category_hint: general
