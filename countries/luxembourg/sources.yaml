  - id: gnews_luxembourg_batch
    name: Google News (Luxembourg Public Radio & Green/Parliament - 100komma7/Infogreen/Chd.lu)
    homepage: https://news.google.com
    language: fr
    scope: domestic
    kind: media
    governing_body: Google LLC
    state_affiliated: false
    aggregator: google_news
    feeds:
      - {url: "https://news.google.com/rss/search?q=(site:100komma7.lu+OR+site:infogreen.lu+OR+site:chd.lu)+when:7d&hl=fr&gl=LU&ceid=LU:fr", section: Radio & Parlement, category_hint: internal_politics}

  - id: gnews_en_lu
    name: Google News (Luxembourg & ECJ/EIB - International)
    homepage: https://news.google.com
    language: en
    scope: international
    kind: media
    aggregator: google_news
    governing_body: n/a (aggregator)
    state_affiliated: false
    feeds:
      - {url: "https://news.google.com/rss/search?q=Luxembourg+(%22Luc+Frieden%22+OR+%22Xavier+Bettel%22+OR+%22European+Court+of+Justice%22+OR+ECJ+OR+EIB)+when:7d&hl=en-US&gl=US&ceid=US:en", section: Luxembourg & EU institutions, category_hint: foreign_policy}
