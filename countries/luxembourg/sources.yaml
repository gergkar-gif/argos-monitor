  - id: reporter_lu
    name: Reporter.lu
    homepage: https://www.reporter.lu
    language: de
    scope: domestic
    kind: media
    governing_body: Reporter Media S.à r.l. (independent reader-funded investigative digital magazine in Luxembourg)
    state_affiliated: false
    feeds:
