    - "Central Bank of Kenya (CBK) Kamau Thugge, Kenyan shilling exchange rate, IMF program and Eurobond debt repayments, taxes and revenue authority (KRA), inflation, energy tariffs, agriculture"
  foreign_policy:
    - "Kenya leadership in East African Community (EAC) and IGAD, Haiti multinational security support mission (MSS), Sudan and DRC mediation, US non-NATO ally status, trade with EU and China"
  defence_security:
    - "Kenya Defence Forces (KDF), police operations and Independent Policing Oversight Authority (IPOA), Al-Shabaab border threats in Mandera and Lamu, banditry in North Rift"
  society:
