# Albania source registry (decision D15).
# Combines statutory wire (ATSH / ATA) and public broadcaster (RTSH) with investigative portals (Reporter.al / BIRN Albania,
# BoldNews), high-reach digital & broadcast outlets (BalkanWeb, Euronews Albania, ABC News, Gazeta Si, JavaNews, Faxweb, Fjala,
# Argumentum, Botimet Nazarko), and major TV/print/economic dailies covered via Google News (Top Channel, Panorama, Shqiptarja,
# Monitor.al, Syri.net, Dosja.al, Lapsi.al, TV Klan, Gazeta Tema, Ora News, Albanian Daily News).

sources:
  - id: atsh_al
    name: ATSH (Albanian Telegraphic Agency)
    homepage: https://ata.gov.al
    language: sq
    scope: domestic
    kind: official
    governing_body: Agjencia Telegrafike Shqiptare (official statutory state news agency of Albania)
    state_affiliated: true
    feeds:
      - {url: "https://ata.gov.al/feed/", section: ATSH, category_hint: general}

  - id: rtsh_al
    name: RTSH (Albanian Radio Television)
    homepage: https://rtsh.al
    language: sq
    scope: domestic
    kind: official
    governing_body: Radio Televizioni Shqiptar (statutory national public-service broadcaster)
    state_affiliated: false
    feeds:
      - {url: "https://rtsh.al/feed/", section: Lajme, category_hint: general}

  - id: reporter_al
    name: Reporter.al (BIRN Albania)
    homepage: https://www.reporter.al
    language: sq
    scope: domestic
    kind: media
    governing_body: Balkan Investigative Reporting Network Albania (Tirana — premier investigative journalism center covering SPAK, judiciary, and public procurement)
    state_affiliated: false
    feeds:
      - {url: "https://www.reporter.al/feed/", section: Hulumtime, category_hint: internal_politics}

  - id: balkanweb_al
    name: BalkanWeb
    homepage: https://www.balkanweb.com
    language: sq
    scope: domestic
    kind: media
    governing_body: Focus Media Group / News24 (Albania's highest-traffic 24-hour news and political portal)
    state_affiliated: false
    feeds:
      - {url: "https://www.balkanweb.com/feed/", section: Lajme, category_hint: general}

  - id: euronews_al
    name: Euronews Albania
    homepage: https://euronews.al
    language: sq
    scope: domestic
    kind: media
    governing_body: Intermedica / Euronews Affiliate (bilingual Albanian and English broadcast news network in Tirana)
    state_affiliated: false
    feeds:
      - {url: "https://euronews.al/feed/", section: Lajme, category_hint: general}
      - {url: "https://euronews.al/en/feed/", section: English News, category_hint: general}

