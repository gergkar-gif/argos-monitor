    homepage: https://www.panorama.com.al
    language: sq
    scope: domestic
    kind: media
    governing_body: Panorama Group Sh.a. (Albania's highest-circulation daily print and digital newspaper)
    state_affiliated: false
    feeds:
      - {url: "https://www.panorama.com.al/feed/", section: Politike, category_hint: internal_politics}

