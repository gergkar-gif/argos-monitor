# Albania source registry (decision D15).
# Combines statutory state wire (ATSH / ATA) and public broadcaster (RTSH) with leading investigative and analytical portals (Reporter.al / BIRN Albania, BalkanWeb, Top Channel, Panorama, Shqiptarja.com, Monitor.al, Exit.al, Lapsi.al, Syri.net, Dosja.al, Albanian Daily News).

sources:
  - id: atsh_al
    name: ATSH (Albanian Telegraphic Agency)
    homepage: https://ata.gov.al
    language: sq
    scope: domestic
    kind: official
    aggregator: google_news
    governing_body: Agjencia Telegrafike Shqiptare (official statutory state news agency of Albania)
    state_affiliated: true
    feeds:
      - {url: "https://news.google.com/rss/search?q=site:ata.gov.al+when:3d&hl=sq&gl=AL&ceid=AL:sq", section: ATSH, category_hint: general}

  - id: reporter_al
    name: Reporter.al (BIRN Albania)
    homepage: https://www.reporter.al
    language: sq
    scope: domestic
    kind: media
    governing_body: Balkan Investigative Reporting Network Albania (Tirana — premier investigative journalism center covering SPAK, judiciary, and public procurement)
    state_affiliated: false
    feeds:
      - {url: "https://www.reporter.al/feed/", section: Hulumtime, category_hint: internal_politics}

  - id: balkanweb_al
    name: BalkanWeb
    homepage: https://www.balkanweb.com
    language: sq
    scope: domestic
    kind: media
    governing_body: Focus Media Group / News24 (Albania's highest-traffic 24-hour news and political portal)
    state_affiliated: false
    feeds:
      - {url: "https://www.balkanweb.com/feed/", section: Lajme, category_hint: general}

  - id: topchannel_al
    name: Top Channel
    homepage: https://top-channel.tv
    language: sq
    scope: domestic
    kind: media
    governing_body: Top Media Group (leading national commercial television broadcaster and news portal in Tirana)
    state_affiliated: false
    feeds:
      - {url: "https://top-channel.tv/feed/", section: Lajme, category_hint: general}

  - id: panorama_al
