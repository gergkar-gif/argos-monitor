    label: Presidency, Governance & Karakalpakstan
    weight: 1.0
    category: internal_politics
    describe:
      - President Shavkat Mirziyoyev, Oliy Majlis, government reshuffles, Karakalpakstan autonomous republic, media and NGO regulations
