# Croatia's additions to the shared themes (../../themes.yaml).
themes:
  - id: party_gov
    label: "HDZ-DP Coalition, Plenković vs. Milanović & EPPO Anti-Corruption"
    weight: 1.0
    category: internal_politics
    describe:
      - Prime Minister Andrej Plenković (HDZ and Homeland Movement coalition), President Zoran Milanović constitutional clashes, Croatian Parliament (Sabor), SDP and Možemo opposition, USKOK and European Public Prosecutor's Office (EPPO) investigations
      - Vlada Andreja Plenkovića, predsjednik Zoran Milanović, Hrvatski sabor, HDZ, Domovinski pokret, SDP, Možemo, USKOK, EPPO, Ustavni sud
    keywords: ["plenković", "plenkovic", "milanović", "milanovic", "sabor", "hdz", "domovinski pokret", "sdp", "možemo", "uskok", "eppo", "turudić"]

  - id: energy_infra
    label: "JANAF (Adria Oil Pipeline), Krk LNG Terminal, INA-MOL & Port of Rijeka"
    weight: 1.0
    category: economics
    describe:
      - JANAF (Adria oil pipeline) transit fees and capacity disputes with MOL and Hungary, Krk LNG terminal expansion, INA-MOL corporate governance, Port of Rijeka gateway railway corridor, and Eurozone inflation
      - Jadranski naftovod (JANAF), LNG terminal Krk, INA, MOL, tranzit nafte za Mađarsku i Slovačku, Luka Rijeka, HNB, inflacija
    keywords: ["janaf", "jadranski naftovod", "krk lng", "lng terminal", "ina", "mol", "luka rijeka", "hnb", "proračun", "inflacija"]

  - id: security
    label: "Armed Forces Modernization (Rafale / Conscription) & Schengen External Border"
    weight: 0.95
    category: defence_security
    describe:
      - Croatian Armed Forces (OSRH) modernization (Dassault Rafale fighter jets, Leopard 2A8 tanks, HIMARS), reintroduction of mandatory military service (vojni rok), and Schengen external border policing with Bosnia and Serbia
      - Oružane snage RH (OSRH), MORH, Ivan Anušić, Rafale, Leopard, HIMARS, obvezni vojni rok, Schengen granica
    keywords: ["morh", "osrh", "anušić", "anusic", "rafale", "himars", "vojni rok", "schengen", "hrvatska vojska"]

  - id: diplomacy
    label: "Western Balkans, Bosnia Dayton Electoral Reform & Central European Relations"
    weight: 0.95
    category: foreign_policy
    describe:
      - Croatia's policy on Bosnia and Herzegovina electoral law and Croat constituent rights, bilateral relations with Serbia, Hungary, and Slovenia, OECD accession, and Three Seas Initiative
      - odnosi s Bosnom i Hercegovinom, Hrvati u BiH, izborni zakon, odnosi sa Srbijom, Mađarskom i Slovenijom, OECD, Inicijativa triju mora
    keywords: ["bosna i hercegovina", "hrvati u bih", "izborni zakon", "oecd", "tri mora", "grlić radman", "radman"]
