# Moldova source registry (decision D15).
# Combines statutory agency (Moldpres) and public broadcaster (TRM / Moldova 1 via GN) with independent/investigative
# Chișinău media (Ziarul de Gardă, RISE Moldova, NewsMaker RO/RU, TV8, PRO TV Chișinău, Jurnal.md, AGORA, Europa Liberă),
# national and regional portals (Deschide.md, Realitatea.md, UNIMEDIA, Cotidianul.md, Point.md, Știri.md, IPN, SP Bălți),
# and economic portals (Bani.md, Mold-Street).
