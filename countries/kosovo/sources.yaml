# Kosovo source registry (decision D15).
# Combines broadsheet of record (Koha.net), news agency (KosovaPress), public broadcaster (RTK via GN), leading Pristina
# digital dailies (Telegrafi, Gazeta Express, Reporteri, Epoka e Re, Sinjali, Dukagjini, Lajmi.net, Paparaci, Botapress,
# Nacionale, Periskopi, Zëri, Klan Kosova, Kallxo, Bota Sot), northern Serb portals (KoSSev, Radio Kim), and diaspora/regional outlets.

sources:
  - id: koha_net
    name: Koha Ditore (Koha.net)
    homepage: https://www.koha.net
    language: sq
    scope: domestic
    kind: media
    governing_body: Koha Group (independent daily newspaper of record in Pristina)
    state_affiliated: false
    feeds:
      - {url: "https://www.koha.net/rss", section: Lajmet, category_hint: general}
      - {url: "https://www.koha.net/en/rss", section: English News, category_hint: general}

  - id: telegrafi_ks
    name: Telegrafi
    homepage: https://telegrafi.com
    language: sq
    scope: domestic
    kind: media
    governing_body: Telegrafi LLC (leading independent digital news portal in Kosovo covering politics and economy)
    state_affiliated: false
    feeds:
      - {url: "https://telegrafi.com/feed/", section: Lajme, category_hint: internal_politics}

  - id: kosovapress_ks
