    language: sq
    scope: domestic
    kind: media
    aggregator: google_news
    governing_body: MediaWorks / Internews Kosova / Insajderi / IndeksOnline / Nacionale / Zëri / Klan Kosova
    state_affiliated: false
    feeds:
