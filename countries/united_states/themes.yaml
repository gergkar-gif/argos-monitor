# United States editorial policy priority themes.
# High-weight themes for foreign-affairs analysts and diplomatic observers.

themes:
  - id: executive_congressional_governance
    label: "Executive & Congressional Governance"
    weight: 1.0
    keywords:
      - "white house"
      - "executive order"
      - "capitol hill"
      - "senate confirmation"
      - "debt ceiling"
      - "house speaker"
      - "appropriations"
      - "veto"
      - "filibuster"
      - "special counsel"
    description: "Executive branch decisions, cabinet nominations, legislative gridlock, congressional investigations, and federal budget enactments."

  - id: federal_reserve_macroeconomics
    label: "Federal Reserve & Monetary Policy"
    weight: 0.95
    keywords:
      - "federal reserve"
      - "fomc"
      - "jerome powell"
      - "interest rates"
      - "treasury yields"
      - "inflation"
      - "cpi"
      - "quantitative tightening"
      - "nonfarm payrolls"
      - "tariff"
    description: "Federal Reserve interest rate decisions, inflation telemetry, bond market liquidity, and trade tariff implementations."

