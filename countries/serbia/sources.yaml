# Serbia source registry (decision D15).
# Combines statutory public broadcaster (RTS) and news wires (Tanjug, Beta, FoNet via GN) with independent/United Media outlets
# (N1, Danas, Nova.rs, Insajder, KRIK, CINS, Istinomer, Vreme, Nedeljnik, Peščanik), commercial/tabloid dailies
# (Kurir, Telegraf, B92, Blic, Novosti, Informer), business/broadcast (Euronews Srbija), and regional portals (Južne vesti, Autonomija, 021.rs).

sources:
  - id: rts_sr
    name: RTS (Radio Television of Serbia)
    homepage: https://www.rts.rs
    language: sr
    scope: domestic
    kind: official
    governing_body: Public Media Service of Serbia (statutory public broadcaster)
    state_affiliated: true
    feeds:
      - {url: "https://www.rts.rs/page/stories/sr/rss.html", section: Najnovije, category_hint: general}

  - id: n1_rs
    name: N1 Srbija
    homepage: https://n1info.rs
    language: sr
    scope: domestic
    kind: media
    governing_body: United Media (independent cable news channel & portal, CNN affiliate)
    state_affiliated: false
    feeds:
      - {url: "https://n1info.rs/feed/", section: Najnovije, category_hint: general}

  - id: danas
    name: Danas
    homepage: https://www.danas.rs
    language: sr
    scope: domestic
    kind: media
    governing_body: Dan Graf d.o.o. / United Media (independent daily newspaper)
    state_affiliated: false
    feeds:
      - {url: "https://www.danas.rs/feed/", section: Najnovije, category_hint: general}

  - id: nova_rs
    name: Nova.rs
    homepage: https://nova.rs
    language: sr
    scope: domestic
    kind: media
    governing_body: United Media (independent news portal)
    state_affiliated: false
    feeds:
      - {url: "https://nova.rs/feed/", section: Najnovije, category_hint: general}

  - id: euronews_rs
    name: Euronews Srbija
    homepage: https://www.euronews.rs
    language: sr
    scope: domestic
    kind: media
    governing_body: HD-Win / Arena Channels Group (Serbian television broadcaster covering business, economy, and politics)
    state_affiliated: false
    feeds:
      - {url: "https://www.euronews.rs/rss/biznis/biznis-vesti", section: Biznis, category_hint: economics}

  - id: b92
    name: B92
    homepage: https://www.b92.net
    language: sr
    scope: domestic
    kind: media
    governing_body: Kopernikus Corporation (major commercial news portal)
    state_affiliated: false
    feeds:
      - {url: "https://www.b92.net/feed/", section: Vesti, category_hint: general}

  - id: blic
    name: Blic
    homepage: https://www.blic.rs
    language: sr
    scope: domestic
    kind: media
    governing_body: Ringier Serbia (major national daily newspaper)
    state_affiliated: false
    feeds:
      - {url: "https://www.blic.rs/rss/danasnje-vesti", section: Vesti dana, category_hint: general}

  - id: kurir_rs
    name: Kurir
    homepage: https://www.kurir.rs
    language: sr
    scope: domestic
    kind: media
    governing_body: Adria Media Group / Wireless Media (high-circulation Belgrade tabloid daily and political portal)
    state_affiliated: false
    feeds:
      - {url: "https://www.kurir.rs/rss", section: Vesti, category_hint: general}

  - id: telegraf_rs
    name: Telegraf.rs
    homepage: https://www.telegraf.rs
    language: sr
    scope: domestic
    kind: media
    governing_body: Internet Group d.o.o. (high-traffic commercial Serbian digital daily portal)
    state_affiliated: false
    feeds:
      - {url: "https://www.telegraf.rs/rss", section: Vesti, category_hint: general}

  - id: novosti_rs
    name: Večernje novosti
    homepage: https://www.novosti.rs
    language: sr
    scope: domestic
    kind: media
    governing_body: Kompanija Novosti a.d. (historic Belgrade daily newspaper covering domestic politics, Kosovo, and regional affairs)
    state_affiliated: false
    feeds:
      - {url: "https://www.novosti.rs/rss/danasnje-vesti", section: Vesti, category_hint: general}

  - id: insajder
    name: Insajder
    homepage: https://insajder.net
    language: sr
    scope: domestic
    kind: media
    governing_body: Insajder Produkcija (independent investigative newsroom)
    state_affiliated: false
    feeds:
      - {url: "https://insajder.net/feed", section: Vesti, category_hint: internal_politics}

  - id: krik
    name: KRIK
    homepage: https://www.krik.rs
    language: sr
    scope: domestic
    kind: media
    governing_body: Crime and Corruption Reporting Network (independent investigative portal)
    state_affiliated: false
    feeds:
      - {url: "https://www.krik.rs/feed/", section: Vesti, category_hint: internal_politics}

  - id: cins
    name: CINS
    homepage: https://www.cins.rs
    language: sr
    scope: domestic
    kind: media
    governing_body: Center for Investigative Journalism of Serbia (independent investigative non-profit)
    state_affiliated: false
    feeds:
      - {url: "https://www.cins.rs/feed/", section: Istraživanja, category_hint: internal_politics}

  - id: istinomer_rs
    name: Istinomer
    homepage: https://www.istinomer.rs
    language: sr
    scope: domestic
    kind: media
    governing_body: CRTA (Center for Research, Transparency and Accountability — Serbian fact-checking and political accountability portal)
    state_affiliated: false
    feeds:
      - {url: "https://www.istinomer.rs/feed/", section: Ocene i analize, category_hint: internal_politics}

  - id: juznevesti
    name: Južne vesti
    homepage: https://www.juznevesti.com
    language: sr
    scope: domestic
    kind: media
    governing_body: Independent regional investigative portal (southern Serbia / Niš)
    state_affiliated: false
    feeds:
      - {url: "https://www.juznevesti.com/feed/", section: Vesti, category_hint: general}

  - id: autonomija
    name: Autonomija (Vojvodina)
    homepage: https://autonomija.info
    language: sr
    scope: domestic
    kind: media
    governing_body: Independent Journalists' Association of Vojvodina (NDNV)
    state_affiliated: false
    feeds:
      - {url: "https://autonomija.info/feed/", section: Vesti, category_hint: general}

  - id: gnews_rs_press
    name: Politika / Vreme / Nedeljnik / Peščanik / 021.rs / Tanjug / Beta / NIN / Informer (via Google News)
    homepage: https://www.politika.rs
    language: sr
    scope: domestic
    kind: media
    aggregator: google_news
    governing_body: Politika / Vreme / Nedeljnik / Peščanik / Radio 021 / Tanjug / Beta / NIN / Informer
    state_affiliated: false
    feeds:
      - {url: "https://news.google.com/rss/search?q=(site:politika.rs+OR+site:vreme.com+OR+site:nedeljnik.rs+OR+site:pescanik.net+OR+site:021.rs+OR+site:tanjug.rs+OR+site:beta.rs+OR+site:nin.rs+OR+site:raskrikavanje.rs)+when:3d&hl=sr&gl=RS&ceid=RS:sr", section: Nacionalni i regionalni mediji, category_hint: general}

  - id: gnews_sr
    name: Google News (Serbian)
    homepage: https://news.google.com
    language: sr
    scope: domestic
    kind: media
    aggregator: google_news
    needs_mention: true
    governing_body: n/a (aggregator)
    state_affiliated: false
    feeds:
      - {url: "https://news.google.com/rss/search?q=(Vlada+Srbije+OR+Vu%C4%8Di%C4%87+OR+Skup%C5%A1tina)+when:1d&hl=sr&gl=RS&ceid=RS:sr", section: Politika, category_hint: internal_politics}
      - {url: "https://news.google.com/rss/search?q=(Srbija+ekonomija+OR+NBS+OR+litijum+OR+NIS)+when:1d&hl=sr&gl=RS&ceid=RS:sr", section: Ekonomija, category_hint: economics}

  - id: gnews_en_rs
    name: Google News (Serbia - English)
    homepage: https://news.google.com
    language: en
    scope: international
    kind: media
    aggregator: google_news
    governing_body: n/a (aggregator)
    state_affiliated: false
    feeds:
      - {url: "https://news.google.com/rss/search?q=Serbia+when:1d&hl=en-US&gl=US&ceid=US:en", section: Serbia, category_hint: general}
      - {url: "https://news.google.com/rss/search?q=Serbia+(Vucic+OR+Kosovo+OR+EU+OR+Russia+OR+China)+when:1d&hl=en-US&gl=US&ceid=US:en", section: Serbia geopolitics, category_hint: foreign_policy}
      - {url: "https://news.google.com/rss/search?q=Serbia+(lithium+OR+economy+OR+investment+OR+protests+OR+NIS)+when:1d&hl=en-US&gl=US&ceid=US:en", section: Serbia economy & politics, category_hint: economics}
