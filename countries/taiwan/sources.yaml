# Taiwan source registry (decision D15).
# Combines premier English daily Taipei Times, leading national daily Liberty Times (Chinese), national wires (CNA / Focus Taiwan via Google News), and diaspora Chinese reporting.

sources:
  - id: taipeitimes_en
    name: Taipei Times
    homepage: https://www.taipeitimes.com
    language: en
    scope: domestic
    kind: media
    governing_body: Liberty Times Group (independent English daily newspaper of record in Taipei)
    state_affiliated: false
    feeds:
      - {url: "https://www.taipeitimes.com/xml/index.rss", section: Top Stories, category_hint: general}

  - id: ltn_politics
    name: Liberty Times (Politics - Traditional Chinese)
    homepage: https://news.ltn.com.tw
    language: zh
    scope: domestic
    kind: media
    governing_body: The Liberty Times Group (major national daily newspaper)
    state_affiliated: false
    feeds:
      - {url: "https://news.ltn.com.tw/rss/politics.xml", section: Politics, category_hint: internal_politics}

  - id: ltn_business
