    name: Anadolu Agency (English)
    homepage: https://www.aa.com.tr/en
    language: en
    scope: domestic
    kind: official
    governing_body: Anadolu Ajansı (statutory state news agency of Türkiye)
    state_affiliated: true
    needs_mention: true
    feeds:
      - {url: "https://www.aa.com.tr/en/rss/default?cat=live", section: Live, category_hint: general}

