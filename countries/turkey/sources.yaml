# Turkey source registry (decision D15).
# Combines statutory agency (Anadolu Agency) and public broadcaster (TRT Haber) with major pro-government dailies
# (Sabah, Daily Sabah, Yeni Şafak, Hürriyet, Milliyet), centrist/commercial broadcasters (Habertürk, NTV, Bloomberg HT),
# financial press (Ekonomim), opposition and secular dailies (Cumhuriyet, Sözcü, Karar, BirGün, Evrensel), independent digital
# journalism (T24, Medyascope, Diken, Bianet, Halk TV), and international Turkish services (BBC Türkçe, DW Türkçe).

sources:
