# Laos source registry (decision D15).
# Combines independent Vientiane digital reporting (The Laotian Times), Lao-language diaspora coverage (Radio Free Asia Lao), and regional/international monitoring via Google News.

sources:
  - id: laotiantimes_en
    name: The Laotian Times
    homepage: https://laotiantimes.com
    language: en
    scope: domestic
    kind: media
    governing_body: Songmue Media (independent digital publisher in Vientiane)
    state_affiliated: false
    feeds:
      - {url: "https://laotiantimes.com/feed/", section: Top Stories, category_hint: general}
      - {url: "https://laotiantimes.com/category/business/feed/", section: Business, category_hint: economics}

  - id: rfa_lo
    name: Radio Free Asia (Lao)
    homepage: https://www.rfa.org/lao
    language: lo
    scope: abroad_local
    kind: media
    governing_body: US Agency for Global Media (USAGM / independent grantee)
    state_affiliated: false
    feeds:
      - {url: "https://www.rfa.org/arc/outboundfeeds/lao/rss/", section: News, category_hint: general}

  - id: gnews_la_domestic
    name: National Press & Wires (Vientiane Times / KPL via Google News)
    homepage: https://www.vientianetimes.org.la
    language: en
    scope: domestic
    kind: official
    aggregator: google_news
    governing_body: Ministry of Information, Culture and Tourism / KPL News Agency
    state_affiliated: true
    feeds:
      - {url: "https://news.google.com/rss/search?q=(site:laotiantimes.com+OR+site:vientianetimes.org.la+OR+site:kpl.gov.la)+when:7d&hl=en-US&gl=US&ceid=US:en", section: Domestic Wires, category_hint: general}

  - id: gnews_en_la
    name: Google News (Laos - General & International)
    homepage: https://news.google.com
    language: en
    scope: international
    kind: media
    aggregator: google_news
    governing_body: n/a (aggregator)
    state_affiliated: false
    feeds:
      - {url: "https://news.google.com/rss/search?q=Laos+when:1d&hl=en-US&gl=US&ceid=US:en", section: Laos, category_hint: general}

  - id: gnews_la_econ
    name: Google News (Laos Economy, Debt & Energy)
    homepage: https://news.google.com
    language: en
    scope: international
    kind: media
    aggregator: google_news
    governing_body: n/a (aggregator)
    state_affiliated: false
    feeds:
      - {url: "https://news.google.com/rss/search?q=Laos+(economy+OR+kip+OR+debt+OR+inflation+OR+railway+OR+hydropower)+when:7d&hl=en-US&gl=US&ceid=US:en", section: Economy, category_hint: economics}

  - id: gnews_la_gov
    name: Google News (Laos Governance & Diplomacy)
    homepage: https://news.google.com
    language: en
    scope: international
    kind: media
    aggregator: google_news
    governing_body: n/a (aggregator)
    state_affiliated: false
    feeds:
      - {url: "https://news.google.com/rss/search?q=Laos+(Thongloun+OR+Sonexay+OR+LPRP+OR+ASEAN+OR+China+OR+Vietnam)+when:7d&hl=en-US&gl=US&ceid=US:en", section: Diplomacy, category_hint: foreign_policy}

  - id: gnews_la_sec
    name: Google News (Laos Security, Border & Mekong)
    homepage: https://news.google.com
    language: en
    scope: international
    kind: media
    aggregator: google_news
    governing_body: n/a (aggregator)
    state_affiliated: false
    feeds:
      - {url: "https://news.google.com/rss/search?q=Laos+(security+OR+Mekong+OR+border+OR+Golden+Triangle+OR+scam)+when:7d&hl=en-US&gl=US&ceid=US:en", section: Security, category_hint: defence_security}
