      - "gerd"
      - "grand ethiopian renaissance dam"
      - "nile basin"
      - "somalia military pact"
      - "sudan conflict"
      - "water security"
    description: "Nile water quota negotiations with Addis Ababa, Egypt-Somalia defense cooperation, and diplomatic containment in the Horn of Africa."
