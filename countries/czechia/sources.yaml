# Czechia source registry (decision D15, D21).
# Combines public radio/TV (iROZHLAS, ČT24), state wire (ČTK), flagship dailies (Deník N, Seznam Zprávy, Novinky.cz, iDNES.cz, Lidovky.cz, Hospodářské noviny, Aktuálně.cz, Deník.cz, Prague Morning), weeklies & investigative portals (Respekt, Reflex, Echo24, FORUM 24, Deník Alarm, Investigace.cz, HlídacíPes), financial/tabloid/commercial TV (E15, Blesk, CNN Prima News, Info.cz), Slovak regional press, and international wires.

