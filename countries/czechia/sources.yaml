# Czechia source registry (decision D15, D21).
# Combines independent Czech dailies (Deník N, Seznam Zprávy, Novinky.cz, Prague Morning), public radio iROZHLAS, state wire ČTK / public broadcaster ČT24 via Google News, Slovak regional press, and international wires.

sources:
  - id: irozhlas_cz
    name: iROZHLAS
    homepage: https://www.irozhlas.cz
    language: cs
    scope: domestic
    kind: media
    governing_body: Český rozhlas (Czech Public Radio newsroom)
    state_affiliated: false
    feeds:
      - {url: "https://www.irozhlas.cz/rss/irozhlas/zpravy-domov", section: Domov, category_hint: internal_politics}

  - id: seznamzpravy_cz
    name: Seznam Zprávy
