  - id: gnews_cz_official
    name: ČTK / ČT24 (Czech News Agency & Public Television via Google News)
    homepage: https://www.ceskenoviny.cz
    language: cs
    scope: domestic
    kind: official
    aggregator: google_news
    needs_mention: true
    governing_body: Czech News Agency (ČTK) / Czech Television (ČT24)
    state_affiliated: true
    feeds:
      - {url: "https://news.google.com/rss/search?q=(site:ct24.ceskatelevize.cz+OR+site:ceskenoviny.cz)+when:7d&hl=cs&gl=CZ&ceid=CZ:cs", section: ČTK & ČT24, category_hint: general}

