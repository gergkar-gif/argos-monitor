    homepage: https://www.teraz.sk
    language: cs
    scope: abroad_local
    kind: media
    aggregator: google_news
    governing_body: Slovak News Agency TASR & Aktuality.sk
    state_affiliated: false
    feeds:
      - {url: "https://news.google.com/rss/search?q=(site:teraz.sk+OR+site:aktuality.sk)+(Cesko+OR+Fiala+OR+Praha)+when:7d&hl=sk&gl=SK&ceid=SK:sk", section: Slovak coverage of Czechia, category_hint: general}

  - id: gnews_en_cz
    name: Google News (Czechia - International)
    homepage: https://news.google.com
    language: en
    scope: international
    kind: media
    aggregator: google_news
    governing_body: n/a (aggregator)
    state_affiliated: false
    feeds:
      - {url: "https://news.google.com/rss/search?q=Czechia+(Prague+OR+Fiala+OR+Pavel+OR+Babis)+when:7d&hl=en-US&gl=US&ceid=US:en", section: Czechia politics, category_hint: internal_politics}
      - {url: "https://news.google.com/rss/search?q=Czechia+(EU+OR+NATO+OR+Ukraine+OR+ammunition)+when:7d&hl=en-US&gl=US&ceid=US:en", section: Czechia EU & diplomacy, category_hint: foreign_policy}
