# China editorial policy priority themes.
# High-weight themes for foreign-affairs analysts and diplomatic observers.

themes:
  - id: party_state_consolidation
    label: "Party-State Consolidation & Personnel"
    weight: 1.0
    keywords:
      - "xi jinping"
      - "politburo"
      - "central committee"
      - "standing committee"
      - "ccdi"
      - "anti-corruption"
      - "national people's congress"
      - "two sessions"
      - "party plenum"
      - "ideological discipline"
    description: "CCP leadership decisions, anti-corruption purges, Central Committee plenums, personnel changes in the military and provinces."

  - id: industrial_policy_decoupling
    label: "Industrial Policy & Tech Self-Reliance"
    weight: 0.95
