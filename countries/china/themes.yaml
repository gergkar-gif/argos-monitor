# China editorial policy priority themes.
themes:
  - id: party_state_consolidation
    label: "Party-State Consolidation & Personnel"
    weight: 1.0
    category: internal_politics
    describe:
      - CCP leadership decisions under Xi Jinping, Politburo and Central Committee plenums, CCDI anti-corruption purges, National People's Congress legislation, and PLA/provincial personnel changes
      - 习近平, 中共中央政治局, 中央委员会, 中纪委反腐, 全国人大, 国务院, 人事任免
