# China source registry (decision D15).
# Combines statutory PRC state wires & official portals (Xinhua, Global Times, China Daily, CGTN, ECNS/CNS, RTHK),
# Hong Kong broadsheets & independent outlets (SCMP, HKFP, Ming Pao, InMediaHK, The Witness), mainland financial/tech
# press (Caixin Global, TechNode, Pandaily, The Paper / Yicai / People's Daily via Chinese Google News), and overseas
# Chinese-language & specialist outlets (BBC Chinese, DW Chinese, RFI Chinese, RFA Mandarin, VOA Chinese, Initium Media,
# Lianhe Zaobao, China Digital Times, CNA Cross-Strait, Pekingnology, China Media Project, Financial Times).

sources:
