# Pakistan editorial policy priority themes.
# High-weight themes for foreign-affairs analysts and diplomatic observers.

themes:
  - id: civil_military_governance_stability
    label: "Civil-Military Dynamics & Judicial Reform"
    weight: 1.0
    keywords:
      - "shehbaz sharif"
      - "asim munir"
      - "imran khan"
      - "constitutional amendment"
      - "sifc"
      - "parliament"
      - "supreme court"
      - "pti protest"
      - "military establishment"
    description: "Army leadership influence via SIFC, constitutional court restructuring, political imprisonment of Imran Khan, and coalition stability."

  - id: internal_security_insurgency_ttp
    label: "Internal Security & Counter-Insurgency"
    weight: 0.95
    keywords:
      - "ttp"
      - "tehreek-e-taliban"
      - "bla"
      - "balochistan liberation army"
      - "ispr"
      - "suicide attack"
      - "chinese nationals"
      - "afghan border"
      - "azm-e-istehkam"
    description: "Surge in TTP attacks in Khyber Pakhtunkhwa, Baloch insurgent ambushes targeting CPEC and Chinese engineers, and border clashes with Kabul."

  - id: imf_debt_macroeconomic_crisis
    label: "IMF Bailout Program & Debt Sustainability"
    weight: 0.9
