      - "imf"
      - "state bank of pakistan"
      - "sbp"
      - "fbr"
      - "external debt"
      - "power tariffs"
      - "privatization"
      - "pia sale"
      - "remittances"
    description: "IMF EFF conditionalities, soaring utility tariffs, tax base broadening, state-owned enterprise privatizations, and default risk management."

  - id: cpec_regional_geopolitics
    label: "CPEC Phase 2 & Strategic Alignment"
    weight: 0.85
    keywords:
      - "cpec"
      - "china-pakistan"
      - "gwadar"
      - "belt and road"
      - "sco"
      - "saudi investment"
      - "india relations"
      - "nuclear deterrence"
    description: "Launch of CPEC Phase 2, security protocols for Chinese personnel, GCC sovereign investment pledges, and strategic nuclear posture."
