# Romania source registry (decision D15).
# Combines statutory national wire (Agerpres via GN) and commercial wires (News.ro, Mediafax) with digital broadsheets
# (HotNews.ro, Adevărul, Cotidianul, Jurnalul Național), investigative centers (Recorder, PressOne, G4Media, Europa Liberă),
# financial dailies (Ziarul Financiar, Profit.ro, Economedia), broadcast/radio (Digi24, Europa FM, PRO TV, TVR Info, Antena 3,
# România TV, B1 TV), sectoral portals (Edupedu, Biziday, Romania24), high-reach tabloids (Libertatea), and Romania Insider.

sources:
  - id: agerpres_ro
    name: Agerpres
    homepage: https://agerpres.ro
    language: ro
    scope: domestic
    kind: official
    aggregator: google_news
    governing_body: Agenția Națională de Presă AGERPRES (statutory national news agency of Romania)
    state_affiliated: true
    feeds:
      - {url: "https://news.google.com/rss/search?q=site:agerpres.ro+when:3d&hl=ro&gl=RO&ceid=RO:ro", section: Național, category_hint: internal_politics}

