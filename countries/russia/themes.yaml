# Russia editorial policy priority themes.
# Remember policy._matcher: len <= 7 matches whole words only; len > 7 matches word-start prefixes.
themes:
  - id: elections
    describe:
      - Russian presidential, State Duma, regional gubernatorial, and municipal elections, Central Election Commission (CIK), voting, turnout, and referendums
      - выборы в России, президентские выборы, выборы в Госдуму, ЦИК, избирательная кампания, голосование, референдум, явка избирателей
    keywords: ["выборы", "выборов", "выборах", "выборам", "выборный", "избирател", "голосован", "референдум", "бюллетен", "цик"]

  - id: diplomacy
    describe:
      - Russian Foreign Ministry (MID) talks, Sergey Lavrov diplomacy, ambassadors, peace negotiations, bilateral summits, visa and border closures
      - МИД России, Сергей Лавров, посол, дипломатические отношения, переговоры, саммит, закрытие границы, двусторонние отношения
    keywords: ["дипломат", "переговоры", "переговоров", "переговорам", "переговорах", "саммит", "саммита", "саммите", "посольств", "внешнепол", "мид", "лавров", "лаврова", "лавровым", "посла", "граница", "границы", "границу", "границе"]

  - id: trade
    describe:
      - Russian oil, gas, grain, and LNG exports, import substitution, tariffs, customs duties, trade with China, India, and Turkey
      - экспорт нефти и газа, импорт, внешняя торговля, таможенные пошлины, параллельный импорт, товарооборот
    keywords: ["экспорт", "экспорта", "импорт", "импорта", "торговля", "торговли", "торговле", "торговый", "торговых", "пошлина", "пошлины", "пошлин", "таможня", "таможни", "таможенн", "товарооб", "нефтегаз", "зерновой"]

  - id: econ_policy
    describe:
      - Bank of Russia monetary policy, key interest rate, inflation, ruble exchange rate, federal budget, tax hikes, sovereign wealth fund
      - Банк России, Центробанк, ключевая ставка, инфляция, курс рубля, федеральный бюджет, налоги, госдолг, ВВП
    keywords: ["центробанк", "набиуллин", "ключевой", "ключевая", "ставка", "ставки", "ставку", "инфляция", "инфляции", "инфляцию", "инфляцио", "бюджет", "бюджета", "бюджете", "налог", "налоги", "налогов", "рубль", "рубля", "рублей", "рублем", "экономика", "экономики", "экономику", "экономиче", "ввп"]

