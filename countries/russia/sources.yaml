# Russia source registry (decision D15).
# Combines statutory state wires (TASS, RIA Novosti) and domestic commercial/business/regional press (Interfax, Kommersant, RBC,
# Vedomosti, Izvestia, RG.ru, Lenta.ru, Fontanka) with independent exiled investigative outlets (Meduza, Novaya Gazeta Europe,
# The Moscow Times, The Bell, IStories, Holod, Agentstvo, Proekt, Mediazona, Verstka, The Insider, OVD-Info, Radio Svoboda,
# Sever.Realii, Sibir.Realii, 7x7).

sources:
  - id: tass_ru
    name: TASS (Russian & English)
    homepage: https://tass.ru
    language: ru
    scope: domestic
    kind: official
    governing_body: Government of the Russian Federation (statutory state news agency)
    state_affiliated: true
    feeds:
      - {url: "https://tass.ru/rss/v2.xml", section: Все новости, category_hint: internal_politics}
      - {url: "https://tass.com/rss/v2.xml", section: English, category_hint: internal_politics}

  - id: ria_novosti
    name: RIA Novosti
    homepage: https://ria.ru
    language: ru
    scope: domestic
    kind: official
    governing_body: Rossiya Segodnya (Russian statutory state news agency)
    state_affiliated: true
    feeds:
      - {url: "https://ria.ru/export/rss2/archive/index.xml", section: Новости, category_hint: internal_politics}

  - id: interfax_ru
    name: Interfax
    homepage: https://interfax.ru
    language: ru
