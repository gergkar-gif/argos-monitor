# Russia source registry (decision D15).
# Combines statutory state wires & official institutions (TASS, RIA Novosti, Rossiyskaya Gazeta, Government.ru, Central Bank,
# Lenta.ru, Izvestia) and domestic commercial/business press (Interfax, Kommersant, RBC, Vedomosti, BFM.ru) with exiled
# independent investigative newsrooms and international public broadcasters (Meduza, Novaya Gazeta Europe, The Moscow Times,
# The Bell, IStories, The Insider, OVD-Info, Verstka, Holod, Agentstvo, Proekt, Mediazona, Paperpaper, Radio Svoboda,
# Current Time, BBC News Russian, DW Russian, Sever.Realii, Sibir.Realii, Fontanka, 7x7).

sources:
  - id: tass_ru
    name: TASS (Russian & English)
    homepage: https://tass.ru
    language: ru
    scope: domestic
    kind: official
    governing_body: Government of the Russian Federation (statutory state news agency)
    state_affiliated: true
    feeds:
      - {url: "https://tass.ru/rss/v2.xml", section: Все новости, category_hint: general}
      - {url: "https://tass.com/rss/v2.xml", section: English, category_hint: general}

