classify:
  internal_politics:
  - President Vladimir Putin, Presidential Executive Office, State Duma, Federation Council, Prime Minister Mikhail Mishustin, United Russia, regional governors, FSB counter-intelligence, opposition crackdowns
  - Владимир Путин, Кремль, Администрация Президента, Госдума, Совет Федерации, Михаил Мишустин, Сергей Собянин, ФСБ, выборы, внутренняя политика, иноагенты, оппозиция
  economics:
  - Bank of Russia (Elvira Nabiullina), key interest rate hikes, inflation, ruble exchange rate, federal budget deficit, oil and gas tax revenues, shadow tanker fleet, Western sanctions evasion, Chinese yuan trade settlements
  - Банк России, Эльвира Набиуллина, ключевая ставка, инфляция, курс рубля, бюджет, налоги, нефтегазовые доходы, санкции, импортозамещение, экспорт, банки
  foreign_policy:
  - Ministry of Foreign Affairs (MFA), Sergey Lavrov, relations with China, North Korea (mutual defense pact), Iran, India, BRICS summit, Global South diplomacy, peace negotiations and ultimatums to the West
  - МИД РФ, Сергей Лавров, БРИКС, ШОС, отношения с Китаем, КНДР, Ираном, Индией, США, ЕС, переговоры, саммит, дипломатия
  defence_security:
  - Ministry of Defense (Andrey Belousov), General Staff (Valery Gerasimov), military industrial complex (Rostec), missile strikes, drone attacks, air defense, nuclear exercises, contract soldier recruitment, frontline operations
  - Минобороны РФ, Андрей Белоусов, Генштаб, Валерий Герасимов, СВО, Ростех, ОПК, ракетные удары, беспилотники, БПЛА, ПВО, ядерные учения, контрактники, мобилизация
  society:
  - Wartime demographic pressure, veteran integration, casualty compensations, national patriotic curriculum, domestic internet censorship (RKN blocks), utility infrastructure breakdowns, healthcare and courts
  - Демография, выплаты, ветераны, цензура, Роскомнадзор, блокировки, ЖКХ, здравоохранение, образование, суд, приговор
