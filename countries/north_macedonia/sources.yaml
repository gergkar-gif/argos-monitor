# North Macedonia source registry (decision D15).
# Combines statutory state wire (MIA) and public broadcaster (MRT) with leading independent investigative and analytical outlets (360 Stepeni, SDK.mk / Sakam Da Kazam, Prizma / BIRN, Telma, Sloboden Pečat, Nezavisen, Nova Makedonija, Makfax, Plusinfo, Alsat-M, Kanal 5).

sources:
  - id: mia_mk
    name: MIA (Media Information Agency)
    homepage: https://mia.mk
    language: mk
    scope: domestic
    kind: official
    aggregator: google_news
    governing_body: Медиумска информативна агенција (statutory national news wire of North Macedonia)
    state_affiliated: true
    feeds:
      - {url: "https://news.google.com/rss/search?q=site:mia.mk+when:3d&hl=mk&gl=MK&ceid=MK:mk", section: МИА, category_hint: general}

  - id: 360stepeni_mk
    name: 360 Stepeni (360 Степени)
    homepage: https://360stepeni.mk
    language: mk
    scope: domestic
    kind: media
    governing_body: 360 Stepeni Media (Skopje — premier independent political analysis and investigative journalism portal)
    state_affiliated: false
    feeds:
      - {url: "https://360stepeni.mk/feed/", section: Вести, category_hint: internal_politics}

  - id: sdk_mk
