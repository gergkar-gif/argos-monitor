# North Macedonia source registry (decision D15).
# Combines statutory state wire (MIA) and public broadcaster (MRT) with investigative/fact-check outlets
# (360 Stepeni, SDK.mk, Prizma / BIRN, Meta.mk, Vistinomer, Fokus), national dailies and commercial TV
# (Sloboden Pečat, Nova Makedonija, Nezavisen, Telma, Sitel, 24 Vesti, Alsat-M, Kanal 5), high-reach digital portals
# (Makfax, Večer, Plusinfo, A1on, Kurir.mk, Republika, Lokalno, Racin), business portal Faktor.mk, and RFE/RL Macedonian.

sources:
  - id: mia_mk
    name: MIA (Media Information Agency)
    homepage: https://mia.mk
    language: mk
    scope: domestic
    kind: official
    aggregator: google_news
    governing_body: Медиумска информативна агенција (statutory national news wire of North Macedonia)
    state_affiliated: true
    feeds:
      - {url: "https://news.google.com/rss/search?q=site:mia.mk+when:3d&hl=bg&gl=BG&ceid=BG:bg", section: МИА, category_hint: general}

  - id: mrt_mk
