# Montenegro source registry (decision D15).
# Combines public broadcasters (RTCG via GN, RTV Nikšić, Gradski) and independent wire (MINA) with major Podgorica dailies
# (Vijesti, Pobjeda, CdM, Dan, Portal Analitika, Antena M), investigative/tabloid/political portals (Monitor, Aktuelno, Volim Podgoricu,
# Standard, Borba, IN4S, Adria TV), business portals (Bankar.me, Investitor.me), and RFE/RL Crna Gora.
sources:
- id: mina_me
  name: MINA (Montenegrin Independent News Agency)
  homepage: https://mina.news
  language: sr
  scope: domestic
  kind: wire
  governing_body: Novinska agencija MINA (Montenegro's primary independent domestic news wire)
  state_affiliated: false
  feeds:
  - url: https://mina.news/feed/
    section: Politika & Ekonomija
    category_hint: general
