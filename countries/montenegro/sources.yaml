# Montenegro source registry (decision D15).
# Combines statutory public broadcaster (RTCG) and wire agency (MINA) with leading Podgorica dailies and investigative portals (Vijesti, Pobjeda, CdM / Cafe del Montenegro, Dan, Portal Analitika, Antena M, Monitor, Bankar.me, Investitor.me, Gradski, Adria TV).

sources:
  - id: rtcg_me
    name: RTCG (Radio and Television of Montenegro)
    homepage: https://rtcg.me
    language: sr
    scope: domestic
    kind: official
    aggregator: google_news
    governing_body: Radio i Televizija Crne Gore (statutory national public-service broadcaster)
    state_affiliated: true
    feeds:
      - {url: "https://news.google.com/rss/search?q=site:rtcg.me+when:3d&hl=sr&gl=ME&ceid=ME:sr", section: RTCG, category_hint: general}

  - id: vijesti_me
    name: Vijesti
    homepage: https://www.vijesti.me
    language: sr
    scope: domestic
    kind: media
    governing_body: Daily Press d.o.o. / United Media (Podgorica — Montenegro's most influential independent daily newspaper and television network)
    state_affiliated: false
    feeds:
      - {url: "https://www.vijesti.me/rss", section: Najnovije, category_hint: internal_politics}

