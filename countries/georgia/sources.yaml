# Georgia source registry (decision D15).
# Combines official & public broadcaster (Agenda.ge, Georgian Public Broadcaster / 1TV via GN) with independent/investigative
# Georgian newsrooms (Civil Georgia EN/KA, Netgazeti, Batumelebi, Publika, Tabula, Radio Tavisupleba, On.ge, Metronome,
# Fortuna, InterPressNews), business/broadcast media (BM.ge, BPN.ge, Formula, Mtavari, Ambebi, SOVA, Georgia Today),
# and Caucasus regional outlets (OC Media, JAMnews, Caucasus Watch).
