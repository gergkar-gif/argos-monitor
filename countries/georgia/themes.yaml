# Georgia's additions to the shared themes (../../themes.yaml).
themes:
  - id: party_gov
    label: Georgian Dream, Elections & Constitutional crisis
    weight: 1.0
    category: internal_politics
    describe:
      - Georgian Dream ruling party, Bidzina Ivanishvili, Prime Minister Irakli Kobakhidze, President Salome Zourabichvili, contested parliamentary elections, opposition protests, foreign influence law
      - ქართული ოცნება, ბიძინა ივანიშვილი, ირაკლი კობახიძე, სალომე ზურაბიშვილი, საპარლამენტო არჩევნები, ოპოზიცია, აქციები
    keywords: ["georgian dream", "ivanishvili", "kobakhidze", "zourabichvili", "zurabishvili", "foreign agents", "foreign influence", "central election commission", "ქართული ოცნება", "ივანიშვილი", "კობახიძე", "ზურაბიშვილი", "არჩევნები"]

  - id: diplomacy
    label: EU Accession Freeze, US Sanctions & Russia/China pivot
    weight: 1.0
    category: foreign_policy
    describe:
      - European Union accession freeze, US visa restrictions and sanctions, relations with Moscow and Beijing, Anaklia Chinese consortium
