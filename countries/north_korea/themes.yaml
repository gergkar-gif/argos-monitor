    - kim yo jong
    - two-state doctrine
    - constitutional revision
    - hostile state
    - workers party
    - monument demolition
    - "김정은"
    - "김여정"
    - "김주애"
    - "조선로동당"
    - "노동당"
    - "당중앙위"
    - "최고인민회의"
    - "적대적 두 국가"
    - "통일 지우기"
    - "국기"
    describe:
    - Designation of South Korea as primary hostile state, abandonment of peaceful reunification rhetoric, party plenums, and Kim Ju Ae succession signals.
    - "김정은 총비서 동향, 김여정 담화, 김주애 후계 구도, 적대적 두 국가론 개헌, 조선로동당 전원회의 및 최고인민회의"

