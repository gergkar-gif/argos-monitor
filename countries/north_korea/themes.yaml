      - 지방발전 20×10, 쌀값, 환율, 배급, 국경 단속, 곡물 유출 통제, 경제계획
    keywords: ["배급", "장마당", "쌀값", "식량", "곡물", "지방발전", "경제", "단속", "무역", "국경"]

