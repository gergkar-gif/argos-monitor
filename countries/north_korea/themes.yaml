# North Korea's additions to the shared themes (../../themes.yaml): English & Korean keywords and descriptions.
themes:
  - id: russia_dprk_military_alliance
    category: defence_security
    label: Russia-DPRK Defense Pact & Troop Deployment
    weight: 1.0
    keywords:
    - russia troops
    - mutual defense treaty
    - vladimir putin
    - artillery shells
    - ballistic missiles
    - technology transfer
    - kursk
    - space technology
    - "북러"
    - "조러"
    - "러시아 파병"
    - "북한군 파병"
    - "파병"
    - "쿠르스크"
    - "포탄"
    - "군사협력"
    - "푸틴"
    describe:
    - North Korean military personnel deployed to Russian war zones, ammunition transfers, and Russian technical assistance for satellites and submarines.
    - "러시아 파병 북한군, 쿠르스크 전선, 포탄 및 탄도미사일 무기 이전, 북러 포괄적 전략적 동반자 조약, 군사기술 이전"

  - id: strategic_deterrence_icbm_testing
    category: defence_security
    label: Strategic Nuclear & ICBM Development
    weight: 0.95
