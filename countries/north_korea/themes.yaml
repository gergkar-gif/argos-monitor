    - hwasong
    - icbm
    - solid-fuel
    - nuclear warhead
    - hypersonic glide
    - submarine launched
    - reconnaissance satellite
    - missile test
    - "화성"
    - "탄도미사일"
    - "미사일"
    - "핵실험"
    - "핵무기"
    - "전술핵"
    - "우라늄"
    - "영변"
    - "군사정찰위성"
    - "핵잠수함"
    describe:
    - High-angle ICBM test launches, multi-warhead guidance testing, solid-fuel rocket motor advances, uranium enrichment, and nuclear doctrine.
    - "대륙간탄도미사일 화성형 시험발사, 고체연료 미사일, 영변 우라늄 농축시설, 전술핵탄두, 군사정찰위성 발사"

