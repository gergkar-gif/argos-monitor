# Azerbaijan source registry (decision D15).
# Combines statutory/pro-government domestic agencies and portals (AZERTAC, Trend, APA, Vesti.az, Day.az, Haqqin.az,
# Minval.az, Oxu.az, Report.az, Caliber.az, AzerNews) with independent domestic & exiled outlets (Turan, PressKlub.az,
# Günün Səsi, Meydan TV, Abzas Media, Toplum TV, Mikroskop Media, Azadlıq Radiosu, Baku Research Institute, Konkret.az,
# Modern.az) and regional/international broadcasters (BBC News Azərbaycanca, OC Media, JAMnews, Caucasus Watch, Eurasianet).

sources:
  - id: azertag_en
    name: AZERTAC (Azerbaijan State News Agency)
    homepage: https://azertag.az/en
    language: en
    scope: domestic
    kind: official
    governing_body: Azerbaijan State News Agency (official state wire)
    state_affiliated: true
    feeds:
      - {url: "https://azertag.az/en/rss", section: Latest, category_hint: general}

  - id: trend_en
    name: Trend News Agency
    homepage: https://en.trend.az
    language: en
    scope: domestic
    kind: media
    governing_body: Trend News Agency (pro-government Baku wire)
    state_affiliated: true
    feeds:
      - {url: "https://en.trend.az/feeds/index.rss", section: All News, category_hint: general}

  - id: apa_en
    name: APA (Azeri-Press Agency)
    homepage: https://apa.az
    language: az
    scope: domestic
    kind: media
    governing_body: APA Holding (pro-government Baku news agency)
    state_affiliated: true
    feeds:
      - {url: "https://apa.az/rss", section: Xəbərlər, category_hint: general}
      - {url: "https://en.apa.az/rss", section: English, category_hint: general}

  - id: vesti_az
    name: Vesti.az
    homepage: https://vesti.az
    language: ru
    scope: domestic
    kind: media
    governing_body: APA Group (pro-government Baku Russian-language agency)
    state_affiliated: true
    feeds:
      - {url: "https://vesti.az/rss", section: Политика, category_hint: internal_politics}

  - id: day_az
    name: Day.az
    homepage: https://news.day.az
    language: ru
    scope: domestic
    kind: media
    governing_body: Day Media Holding (high-reach pro-government Baku portal)
    state_affiliated: true
    feeds:
      - {url: "https://news.day.az/rss/all.rss", section: Все новости, category_hint: general}

  - id: haqqin_ru
    name: Haqqin.az
    homepage: https://haqqin.az
    language: ru
    scope: domestic
    kind: media
    governing_body: Eynulla Fatullayev Media (state-aligned analytical daily)
    state_affiliated: true
    feeds:
      - {url: "https://haqqin.az/rss", section: Политика, category_hint: foreign_policy}

  - id: minval_ru
    name: Minval.az
    homepage: https://minval.az
    language: ru
    scope: domestic
    kind: media
    governing_body: Minval Information Agency (pro-government defense and geopolitics portal)
    state_affiliated: true
    feeds:
      - {url: "https://minval.az/rss", section: Главное, category_hint: defence_security}

  - id: oxu_az
    name: Oxu.az
    homepage: https://oxu.az
    language: az
    scope: domestic
    kind: media
    governing_body: Global Media Group (Azerbaijan's highest-traffic commercial pro-government news portal)
    state_affiliated: true
    feeds:
      - {url: "https://oxu.az/feed", section: Son xəbərlər, category_hint: general}

  - id: pressklub_az
    name: PressKlub.az (Baku Press Club)
    homepage: https://pressklub.az
    language: az
    scope: domestic
    kind: media
    governing_body: Baku Press Club (independent Azerbaijani journalism platform covering media freedom, parliament, and society)
    state_affiliated: false
    feeds:
      - {url: "https://pressklub.az/az/rss/posts", section: Xəbərlər, category_hint: internal_politics}

  - id: gununsesi_az
