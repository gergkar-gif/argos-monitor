    state_affiliated: false
    feeds:
      - {url: "https://www.meydan.tv/en/feed/", section: English, category_hint: general}
      - {url: "https://www.meydan.tv/az/feed/", section: Azərbaycanca, category_hint: general}
      - {url: "https://www.meydan.tv/ru/feed/", section: Русский, category_hint: general}

  - id: mikroskop_az
    name: Mikroskop Media
    homepage: https://mikroskopmedia.com
    language: az
    scope: abroad_local
    kind: media
    governing_body: Mikroskop Media Foundation (Berlin — exiled data and investigative journalism platform)
    state_affiliated: false
    feeds:
      - {url: "https://mikroskopmedia.com/feed/", section: Araşdırma, category_hint: internal_politics}

  - id: bakuresearch_az
    name: Baku Research Institute
    homepage: https://bakuresearchinstitute.org
    language: en
    scope: abroad_local
    kind: media
    governing_body: Baku Research Institute (independent analytical think tank on economy, society, and geopolitics)
    state_affiliated: false
    feeds:
      - {url: "https://bakuresearchinstitute.org/en/feed/", section: Analysis, category_hint: internal_politics}

  - id: bbc_azeri_az
    name: BBC News Azərbaycanca
    homepage: https://www.bbc.com/azeri
    language: az
    scope: abroad_local
    kind: media
    governing_body: British Broadcasting Corporation (independent Azerbaijani-language public international service)
    state_affiliated: false
    feeds:
      - {url: "https://feeds.bbci.co.uk/azeri/rss.xml", section: Azərbaycan, category_hint: general}

  - id: jamnews_az
    name: JAMnews (Azerbaijan Desk)
    homepage: https://jam-news.net
    language: en
    scope: abroad_local
    kind: media
    governing_body: JAMnews Regional Media Network (independent cross-border South Caucasus newsroom)
    state_affiliated: false
    feeds:
      - {url: "https://jam-news.net/category/azerbaijan/feed/", section: Azerbaijan, category_hint: foreign_policy}

  - id: caucasuswatch_az
    name: Caucasus Watch (on Azerbaijan)
    homepage: https://caucasuswatch.de
    language: en
    scope: abroad_local
    kind: media
    governing_body: Caucasus Watch Media (independent European analytical portal tracking South Caucasus diplomacy)
    state_affiliated: false
    needs_mention: true
    feeds:
      - {url: "https://caucasuswatch.de/feed", section: South Caucasus, category_hint: foreign_policy}

  - id: gnews_az_domestic_gn
    name: Turan / Report.az / Caliber.az / AzerNews / Qafqazinfo / Müsavat / Arqument (via Google News)
    homepage: https://turan.az
    language: en
    scope: domestic
    kind: media
    aggregator: google_news
    governing_body: Turan / Report.az / Caliber.az / AzerNews / Qafqazinfo / Müsavat / Arqument
    state_affiliated: false
    feeds:
      - {url: "https://news.google.com/rss/search?q=(site:turan.az+OR+site:report.az+OR+site:caliber.az+OR+site:azernews.az)+when:7d&hl=en-US&gl=US&ceid=US:en", section: Baku English & Agencies, category_hint: foreign_policy}
      - {url: "https://news.google.com/rss/search?q=(site:report.az+OR+site:qafqazinfo.az+OR+site:musavat.com+OR+site:arqument.az+OR+site:turan.az)+when:7d&hl=ru&gl=RU&ceid=RU:ru", section: Пресса Азербайджана, category_hint: internal_politics}

  - id: gnews_az_abroad
    name: Azadlıq Radiosu / Abzas / Toplum TV / OC Media / Eurasianet (via Google News)
    homepage: https://www.azadliq.org
    language: en
    scope: abroad_local
    kind: media
    aggregator: google_news
    governing_body: RFE-RL Azadlıq / Abzas Media / Toplum TV / OC Media / Eurasianet
    state_affiliated: false
    feeds:
      - {url: "https://news.google.com/rss/search?q=(site:azadliq.org+OR+site:abzas.org+OR+site:toplum.tv+OR+((site:oc-media.org+OR+site:eurasianet.org)+Azerbaijan))+when:7d&hl=en-US&gl=US&ceid=US:en", section: Exiled & Regional Press, category_hint: internal_politics}

  - id: gnews_azerbaijan_az
    name: Google News (Azerbaijan National News - Azerbaijani)
    homepage: https://news.google.com
    language: az
    scope: domestic
    kind: media
    aggregator: google_news
    needs_mention: true
    governing_body: Google LLC
    state_affiliated: false
    feeds:
      - {url: "https://news.google.com/rss/search?q=Az%C9%99rbaycan+OR+Bak%C4%B1+when:2d&hl=en-US&gl=US&ceid=US:en", section: National News (Azerbaijani), category_hint: internal_politics}

  - id: gnews_en_az
    name: Google News (Azerbaijan - International)
    homepage: https://news.google.com
    language: en
    scope: international
    kind: media
    aggregator: google_news
    governing_body: n/a (aggregator)
    state_affiliated: false
    feeds:
      - {url: "https://news.google.com/rss/search?q=Azerbaijan+when:1d&hl=en-US&gl=US&ceid=US:en", section: Azerbaijan, category_hint: general}
