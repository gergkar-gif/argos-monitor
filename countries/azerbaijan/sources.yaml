    state_affiliated: false
    feeds:
      - {url: "https://www.gununsesi.info/feed/", section: Siyasət, category_hint: internal_politics}

  - id: modern_az
    name: Modern.az
    homepage: https://modern.az
    language: az
    scope: domestic
    kind: media
    governing_body: Modern Media Group (Baku parliamentary, bureaucratic, and socio-economic news portal)
    state_affiliated: false
    feeds:
      - {url: "https://modern.az/rss", section: Siyasət, category_hint: internal_politics}

  - id: konkret_az
    name: Konkret.az
    homepage: https://konkret.az
    language: az
    scope: domestic
    kind: media
    governing_body: Konkret Media (Baku fast-breaking political and regional portal)
    state_affiliated: false
    feeds:
