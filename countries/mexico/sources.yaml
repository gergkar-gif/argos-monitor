    feeds:
      - url: https://elcoahuilense.com/feed/
        category_hint: economics

  - id: noro_mx
    name: Noro
    homepage: https://noro.mx
    language: es
    scope: domestic
    kind: media
    governing_body: Noro Media
    state_affiliated: false
    notes: Independent digital publication covering culture, cross-border development, and economic innovation in Northwest Mexico.
    feeds:
      - url: https://noro.mx/feed/
        category_hint: general
