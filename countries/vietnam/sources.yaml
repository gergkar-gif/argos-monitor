# Argos Monitor source registry. Edited by hand. Verified 2026-09-30 (see docs/sources.md).
# scope: domestic | abroad_vi | international     kind: media | official | wire
# reprints_vna: does the outlet often reprint Vietnam News Agency copy (syndication check)
# feed.active: false = known not to work today; kept so we remember why (see notes)
# category_hint: internal_politics | economics | foreign_policy | defence_security | society | general
# Fetch note: use a browser-like User-Agent. QDND needs cookies kept across requests (it redirects once to set one).

