      - "norad"
      - "arctic sovereignty"
      - "nato target"
      - "defence policy update"
      - "bill blair"
      - "f-35 fighter"
      - "canadian armed forces"
      - "foreign interference"
    description: "Meeting the NATO 2% GDP benchmark, radar coverage in the High Arctic, submarine procurement programs, and counteracting foreign interference."
