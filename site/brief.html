<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Top Reported Stories · Argos Monitor</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/icon-32.png">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="style.css">
<style>
  .brief h1 { font: 700 1.35rem/1.25 var(--sans); margin: 0 0 0.25rem; }
  .brief ol { padding: 0; list-style: none; display: grid; gap: 2rem; margin-top: 1.75rem; }
  .brief li { border-left: 5px solid var(--bar); padding: 0.2rem 0 0.2rem 1.25rem; display: grid; gap: 0.45rem; }
  .brief h2 { font: 700 1.22rem/1.32 var(--sans); margin: 0; }
  .brief h2 a { text-decoration: none; }
  .brief h2 a:hover { color: var(--indigo); }
  @media print { .bureau, .trans { display: none; } }
</style>
</head>
<body>
<header class="bureau">
  <div class="bureau-inner">
    <div class="masthead">
      <div>
        <h1><a href="index.html#home"><img src="assets/eye.png" alt="" class="logo">Argos Monitor</a></h1>
        <p>Open-source media &amp; crisis monitor</p>
      </div>
      <nav class="topnav" aria-label="Primary">
        <a href="index.html#home">Overview</a>
        <a href="index.html#country">Country Brief</a>
        <a href="index.html#alerts">Alerts</a>
        <a href="index.html#disasters">Disasters</a>
        <a href="index.html#violence">Violent Events</a>
        <a href="brief.html" aria-current="page">Top Reported Stories</a>
        <a href="sources.html">Sources</a>
        <a href="about.html">About</a>
      </nav>
    </div>
    <form class="slip" aria-label="Top reported stories options" onsubmit="event.preventDefault()">
      <label class="field"><span>Country</span><select id="b-country"></select></label>
      <label class="field"><span>Period</span><select id="b-period"></select></label>
      <label class="field"><span>Items</span><select id="b-limit">
        <option value="10" selected>Top 10</option>
        <option value="20">Top 20</option>
        <option value="30">Top 30</option>
        <option value="40">Top 40</option>
        <option value="50">Top 50 (max)</option>
      </select></label>
      <div class="field"><button type="button" class="more" style="margin:0" onclick="print()">Print / Save PDF</button></div>
    </form>
  </div>
</header>
<main class="brief" id="brief">
  <p class="state">Loading…</p>
</main>
<script src="data/index.js"></script>
<script>
(() => {
  const index = window.ARGOS_INDEX, root = document.getElementById('brief');
  const cSel = document.getElementById('b-country'), pSel = document.getElementById('b-period'), nSel = document.getElementById('b-limit');
  const el = (tag, attrs, ...kids) => { const e = document.createElement(tag); for (const [k, v] of Object.entries(attrs || {})) { if (v == null || v === false) continue; if (k === 'text') e.textContent = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v === true ? '' : v); } e.append(...kids.flat(Infinity).filter((x) => x != null && x !== false)); return e; };
  const safe = (u) => { try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : '#'; } catch { return '#'; } };
  if (!index) { root.replaceChildren(el('p', { class: 'state error', text: 'No data found.' })); return; }
  const load = (key) => {
    window.ARGOS_DATA = window.ARGOS_DATA || {};
    if (window.ARGOS_DATA[key]) return Promise.resolve(window.ARGOS_DATA[key]);
    return new Promise((ok, no) => { const s = document.createElement('script'); s.src = `data/${key}.js`; s.onload = () => ok(window.ARGOS_DATA[key]); s.onerror = no; document.head.append(s); });
  };
  try { if (localStorage.getItem('argos.showOriginal') === '1') document.body.classList.add('show-orig'); } catch {}
  const T = { lang: 'en', state: 'checking', tr: null, queue: [] };
  function track(node, text, lang, orig) {
    if (!lang || lang === 'en') return;
    T.queue.push({ node, text, lang, orig });
  }
  async function translateAll() {
    if (T.state !== 'ready' || !T.tr) return;
    while (T.queue.length) {
      const it = T.queue.shift();
      if (!it.node.isConnected) continue;
      try {
        it.node.textContent = await T.tr.translate(it.text);
        it.node.lang = 'en';
        it.orig.textContent = it.text;
        it.orig.lang = it.lang;
        it.orig.hidden = false;
      } catch {}
    }
  }
  async function setupTrans(lang) {
    T.lang = lang; T.tr = null; T.state = 'none';
    const bar = document.getElementById('trans');
    if (!bar || lang === 'en') return;
    if (typeof Translator === 'undefined') {
      bar.replaceChildren();
      return;
    }
    try {
      const a = await Translator.availability({ sourceLanguage: lang, targetLanguage: 'en' });
      if (a === 'available') {
        T.tr = await Translator.create({ sourceLanguage: lang, targetLanguage: 'en' });
        T.state = 'ready';
        paintBar();
        translateAll();
      } else if (a === 'downloadable' || a === 'downloading') {
        const btn = el('button', { type: 'button', class: 'more offer', text: 'Translate headlines to English', onclick: async () => {
          btn.disabled = true;
          T.tr = await Translator.create({ sourceLanguage: lang, targetLanguage: 'en' });
          T.state = 'ready';
          paintBar();
          translateAll();
        } });
        bar.replaceChildren(btn);
      }
    } catch {}
  }
  function paintBar() {
    const bar = document.getElementById('trans');
    if (!bar || T.state !== 'ready') return;
    const on = document.body.classList.contains('show-orig');
    bar.replaceChildren(
      el('p', { class: 'notice quiet', text: 'English lines are machine translations made by your browser. Every headline links to the original article.' }),
      el('button', { type: 'button', class: 'more', text: on ? 'Hide original text' : 'Show original text', onclick: () => {
        document.body.classList.toggle('show-orig', !on);
        try { localStorage.setItem('argos.showOriginal', !on ? '1' : '0'); } catch {}
        paintBar();
      } }));
  }

  const REGIONS = [
    'Southeast Asia', 'Central Europe', 'Balkans', 'Eastern Europe',
    'South Caucasus', 'Central Asia', 'Middle East & Mediterranean',
    'Sub-Saharan Africa', 'South America'
  ];
  const COUNTRY_REGION = {
    cambodia: 'Southeast Asia', indonesia: 'Southeast Asia', myanmar: 'Southeast Asia',
    philippines: 'Southeast Asia', thailand: 'Southeast Asia', vietnam: 'Southeast Asia',
    hungary: 'Central Europe', poland: 'Central Europe', slovakia: 'Central Europe',
    serbia: 'Balkans', moldova: 'Eastern Europe',
    armenia: 'South Caucasus', azerbaijan: 'South Caucasus', georgia: 'South Caucasus',
    kazakhstan: 'Central Asia', uzbekistan: 'Central Asia',
    turkey: 'Middle East & Mediterranean',
    ethiopia: 'Sub-Saharan Africa', nigeria: 'Sub-Saharan Africa', south_africa: 'Sub-Saharan Africa',
    brazil: 'South America', colombia: 'South America',
  };
  const getRegion = (c) => c.region || COUNTRY_REGION[c.id] || 'Other';
  cSel.replaceChildren(...REGIONS.flatMap((r) => {
    const items = index.countries.filter((c) => getRegion(c) === r);
    return items.length ? [el('optgroup', { label: r }, ...items.map((x) => el('option', { value: x.id, text: x.name })))] : [];
  }));
  const initCid = location.hash.slice(1);
  if (index.countries.some((x) => x.id === initCid)) cSel.value = initCid;

  function fillPeriods() {
    const c = index.countries.find((x) => x.id === cSel.value) || index.countries[0];
    const prev = pSel.value || '24h';
    pSel.replaceChildren(...c.periods.map((p) => el('option', { value: p.id, text: p.label })));
    if (c.periods.some((p) => p.id === prev)) pSel.value = prev;
  }

  function render() {
    const c = index.countries.find((x) => x.id === cSel.value) || index.countries[0];
    const p = c.periods.find((x) => x.id === pSel.value) || c.periods[0];
    const limit = Math.min(50, Math.max(1, parseInt(nSel.value, 10) || 10));
    T.queue.length = 0;
    try { if (location.protocol !== 'file:') history.replaceState(null, '', `#${c.id}`); } catch {}
    load(p.file.replace(/\.json$/, '')).then((d) => {
      const top = [...d.stories].sort((a, b) => b.independent_sources - a.independent_sources || b.score - a.score).slice(0, limit);
      root.replaceChildren(
        el('p', { class: 'result-line' }, el('b', { text: `${c.name} · Top ${top.length} reported stories` }), ` · ${p.label.toLowerCase()} · updated ${new Date(d.generated_at).toLocaleString()}`),
        el('div', { id: 'trans', class: 'trans' }),
        el('ol', null, top.map((s) => {
          const a = el('a', { href: safe(s.headline.url), target: '_blank', rel: 'noopener', lang: s.headline.language, text: s.headline.title });
          const o = el('p', { class: 'orig', hidden: true });
          track(a, s.headline.title, s.headline.language, o);
          let qBlock = null;
          if (s.excerpts[0]) {
            const qp = el('p', { lang: c.language, text: s.excerpts[0].text });
            const qo = el('p', { class: 'orig', hidden: true });
            track(qp, s.excerpts[0].text, c.language, qo);
            qBlock = el('blockquote', { class: 'strip' }, qp, qo);
          }
          return el('li', null,
            el('h2', null, a), o, qBlock,
            el('p', { class: 'slipline' },
              el('span', { text: `${s.headline.source} · ${s.independent_sources} independent outlets · ${s.articles} articles` }),
              s.evidence === 'OFFICIAL' && el('span', { class: 'stamp red', text: 'Official' }),
              s.abroad_only && el('span', { class: 'stamp teal', text: 'Not in domestic press' })));
        })));
      setupTrans(c.language);
    }).catch(() => root.replaceChildren(el('p', { class: 'state error', text: 'Could not load the stories.' })));
  }

  fillPeriods();
  cSel.addEventListener('change', () => { fillPeriods(); render(); });
  pSel.addEventListener('change', render);
  nSel.addEventListener('change', render);
  render();
})();
</script>
</body>
</html>
