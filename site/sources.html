<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sources · Argos Monitor</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/icon-32.png">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="style.css">
<style>
  .src { max-width: 72rem; margin: 0 auto; padding: 1.5rem 1.25rem 3rem; }
  .src h1 { font: 600 1.6rem/1.15 var(--stamp); letter-spacing: 0.06em; text-transform: uppercase; margin: 0.25rem 0 0.35rem; }
  .src h2 { font: 600 1.25rem/1.15 var(--stamp); letter-spacing: 0.08em; text-transform: uppercase; margin: 2rem 0 0.5rem; padding-top: 0.4rem; border-top: 3px solid var(--ink); }
</style>
</head>
<body>
<header class="bureau">
  <div class="bureau-inner">
    <div class="masthead" style="border-bottom:0;padding-bottom:0">
      <div>
        <h1><a href="index.html#home"><img src="assets/eye.png" alt="" class="logo">Argos Monitor</a></h1>
        <p>Open-source media &amp; crisis monitor</p>
      </div>
      <nav class="topnav" aria-label="Primary">
        <a href="index.html#home">Overview</a>
        <a href="index.html#alerts">Alerts</a>
        <a href="brief.html">Daily Brief</a>
        <a href="sources.html" aria-current="page">Sources</a>
        <a href="about.html">About</a>
      </nav>
    </div>
  </div>
</header>
<main class="src" id="src"><p class="state">Loading…</p></main>
<script src="data/index.js"></script>
<script src="data/sources.js"></script>
<script>
(() => {
  const root = document.getElementById('src'), idx = window.ARGOS_INDEX, raw = window.ARGOS_SOURCES, data = raw && (raw.sources || raw);
  const el = (tag, attrs, ...kids) => { const e = document.createElement(tag); for (const [k, v] of Object.entries(attrs || {})) { if (v == null || v === false) continue; k === 'text' ? e.textContent = v : e.setAttribute(k, v); } e.append(...kids.flat(Infinity).filter((x) => x != null && x !== false)); return e; };
  const safe = (u) => { try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : '#'; } catch { return '#'; } };
  if (!idx || !data) { root.replaceChildren(el('p', { class: 'state error', text: 'No data found.' })); return; }
  const scope = { domestic: 'In the country', abroad_local: 'Local-language, abroad', international: 'International' };
  root.replaceChildren(
    el('h1', { text: 'Where the stories come from' }),
    el('p', { class: 'byline', text: 'Every outlet Argos reads, who runs it and how it is classified. "State-linked" means a government or ruling-party body runs or controls the outlet.' }),
    ...idx.countries.flatMap((c) => [
      el('h2', { text: `${c.name} (${(data[c.id] || []).length} outlets)` }),
      el('div', { class: 'desk-wrap' }, el('table', { class: 'desk-table' },
        el('thead', null, el('tr', null, ['Outlet', 'Where', 'Type', 'Run by', 'State-linked'].map((x) => el('th', { text: x })))),
        el('tbody', null, (data[c.id] || []).map((s) => el('tr', null,
          el('td', null, el('a', { href: safe(s.homepage), target: '_blank', rel: 'noopener', text: s.name })),
          el('td', { text: scope[s.scope] || s.scope }),
          el('td', { class: 'typed', text: s.kind }),
          el('td', { text: s.governing_body || '' }),
          el('td', null, s.state_affiliated ? el('span', { class: 'stamp red', text: 'Yes' }) : el('span', { class: 'typed', text: 'No' })))))))]))
})();
</script>
</body>
</html>
