<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sources · Argos Monitor</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/icon-32.png">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="style.css">
<style>
  .src { max-width: 68rem; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
  .src h1 { font: 700 1.8rem/1.2 'Source Serif 4', serif; margin: 0.5rem 0; }
  .src h2 { font: 600 1.3rem/1.2 'Source Serif 4', serif; margin: 2rem 0 0.5rem; }
  .src table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
  .src th, .src td { text-align: left; padding: 0.4rem 0.6rem 0.4rem 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
  .src th { font: 600 0.8rem/1 'Barlow Condensed', sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-2); }
  .src .wrap { overflow-x: auto; }
</style>
</head>
<body>
<main class="src" id="src"><p class="state">Loading…</p></main>
<script src="data/index.js"></script>
<script src="data/sources.js"></script>
<script>
(() => {
  const root = document.getElementById('src'), idx = window.ARGOS_INDEX, data = (window.ARGOS_SOURCES || {}).sources;
  const el = (tag, attrs, ...kids) => { const e = document.createElement(tag); for (const [k, v] of Object.entries(attrs || {})) { if (v == null || v === false) continue; k === 'text' ? e.textContent = v : e.setAttribute(k, v); } e.append(...kids.flat().filter((x) => x != null && x !== false)); return e; };
  const safe = (u) => { try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : '#'; } catch { return '#'; } };
  if (!idx || !data) { root.replaceChildren(el('p', { class: 'state error', text: 'No data found.' })); return; }
  const scope = { domestic: 'In the country', abroad_local: 'Local-language, abroad', international: 'International' };
  root.replaceChildren(
    el('a', { href: 'index.html', text: '← Back to Argos' }),
    el('h1', { text: 'Where the stories come from' }),
    el('p', { class: 'byline', text: 'Every outlet Argos reads, who runs it and how it is classified. Notes marked "(to confirm)" come from memory, not a checked source. "State-linked" means a government or ruling-party body runs or controls the outlet.' }),
    idx.countries.map((c) => [
      el('h2', { text: `${c.name} (${(data[c.id] || []).length} outlets)` }),
      el('div', { class: 'wrap' }, el('table', null,
        el('thead', null, el('tr', null, ['Outlet', 'Where', 'Type', 'Run by', 'State-linked'].map((x) => el('th', { text: x })))),
        el('tbody', null, (data[c.id] || []).map((s) => el('tr', null,
          el('td', null, el('a', { href: safe(s.homepage), target: '_blank', rel: 'noopener', text: s.name })),
          el('td', { text: scope[s.scope] || s.scope }),
          el('td', { text: s.kind }),
          el('td', { text: s.governing_body || '' }),
          el('td', { text: s.state_affiliated ? 'Yes' : 'No' }))))))]));
})();
</script>
</body>
</html>
