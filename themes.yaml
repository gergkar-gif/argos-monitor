# What matters to a foreign-office press reviewer (decisions D14, D15). Shared by every country.
# Each theme has a weight (how much a story on this theme counts), keywords (matched in lower case against the
# headlines and summaries of a story's articles) and short descriptions (compared with the story by the embedding
# model). This file holds the language-neutral part: English keywords and descriptions. Each country pack adds its
# own language's keywords and descriptions, and may add themes of its own, in countries/<id>/themes.yaml.
#
# A story's policy weight is the highest weight among its high themes; with only low themes it gets the lowest of
# them; with none, the default. Edit freely: this file is editorial judgement, not code.

default_weight: 0.3

themes:
