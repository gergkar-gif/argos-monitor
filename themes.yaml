# What matters to a foreign-office press reviewer (decisions D14, D15). Shared by every country.
# Each theme has a weight (how much a story on this theme counts), keywords (matched in lower case against the
# headlines and summaries of a story's articles) and short descriptions (compared with the story by the embedding
# model). This file holds the language-neutral part: English keywords and descriptions. Each country pack adds its
# own language's keywords and descriptions, and may add themes of its own, in countries/<id>/themes.yaml.
#
# A story's policy weight is the highest weight among its high themes; with only low themes it gets the lowest of
# them; with none, the default. Edit freely: this file is editorial judgement, not code.

default_weight: 0.3

themes:
  - id: diplomacy
    label: Diplomacy
    weight: 1.0
    category: foreign_policy        # the topic a story falls back to when its wording alone decides nothing
    describe:
      - state visit, bilateral talks, diplomatic relations, strategic partnership, ambassador, foreign minister meeting
    keywords: ["state visit", "bilateral", "diplomatic", "ambassador", "foreign minister", "strategic partnership", "summit", "asean", "apec", "g20", "nato", "united nations"]

  - id: trade
    label: Trade
    weight: 1.0
    category: economics        # the topic a story falls back to when its wording alone decides nothing
    describe:
      - trade agreement, tariffs, exports and imports, trade surplus, anti-dumping, customs
    keywords: ["tariff", "trade", "export", "import", "anti-dumping", "customs", "free trade"]

  - id: investment
    label: Investment
    weight: 1.0
    category: economics        # the topic a story falls back to when its wording alone decides nothing
    describe:
      - foreign direct investment, investors, large investment projects, industrial zones, semiconductors, battery plants, data centres
    keywords: ["investment", "investor", "to invest", "invests", "invested", "invest in", "foreign direct", "fdi", "semiconductor", "data centre", "data center", "battery plant"]

  - id: econ_policy
    label: Economic policy
    weight: 1.0
    category: economics        # the topic a story falls back to when its wording alone decides nothing
    describe:
      - economic and regulatory policy, new decree or law, central bank, interest rates, exchange rate, taxes, state budget, public debt, reform
    keywords: ["economic policy", "regulation", "decree", "central bank", "interest rate", "inflation", "reform", "state budget", "public debt", "gdp"]

  - id: party_gov
    label: Government and parliament
    weight: 0.8
    category: internal_politics        # the topic a story falls back to when its wording alone decides nothing
    describe:
      - ruling party and government decisions, parliament session, cabinet reshuffle, prime minister directives, election
    keywords: ["parliament", "cabinet", "prime minister", "election", "government decree", "national assembly"]

  - id: security
    label: Security and defence
    weight: 0.9
    category: defence_security        # the topic a story falls back to when its wording alone decides nothing
    describe:
      - defence cooperation, maritime security, military exercises, cybersecurity, national security
    keywords: ["defence", "defense", "military", "maritime", "cybersecurity", "national security"]

  - id: anticorruption
    label: Anti-corruption drive
    weight: 0.8
    category: internal_politics        # the topic a story falls back to when its wording alone decides nothing
    describe:
      - anti-corruption campaign, discipline of senior officials, former ministers prosecuted, anti-corruption watchdog
    keywords: ["anti-corruption", "corruption crackdown", "corruption"]

  - id: energy_infra
    label: Energy and infrastructure
    weight: 0.7
    category: economics        # the topic a story falls back to when its wording alone decides nothing
    describe:
      - energy policy, power plants, nuclear power, renewable energy, ports, airports, railways, supply chains
    keywords: ["energy", "power plant", "nuclear", "renewable", "high-speed rail", "supply chain", "pipeline"]

  # Low themes: they only matter when no high theme is present.
  - id: crime_local
    label: Crime and courts
    weight: 0.1
    low: true
    describe:
      - an individual crime, arrest, criminal trial, fraud case, police investigation
    keywords: ["arrested", "trial", "sentenced", "fraud", "murder", "robbery"]

  - id: accident_weather
    label: Accidents and weather
    weight: 0.2
    low: true
    describe:
      - traffic accident, fire, weather forecast, storm, flood, heat wave
    keywords: ["accident", "weather", "storm", "flood", "heatwave", "wildfire"]

  - id: sport_culture
    label: Sport and entertainment
    weight: 0.05
    low: true
    describe:
      - football match, sports championship, singer, film, celebrity news
    keywords: ["football", "championship", "singer", "film", "celebrity", "uefa", "nations league", "predictions", "betting", "odds", "preview", "world cup", "olympic"]
