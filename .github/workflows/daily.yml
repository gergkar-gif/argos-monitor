name: Daily digest

# Collects the news for every country pack and publishes the site to Cloudflare Pages, once daily at 21:17 UTC.
# Runs at 21:17 UTC (04:17 in Vietnam / 22:17 in Hungary), leaving a generous margin for the morning review
# to be fresh and ready by 07:00 local time without exhausting monthly GitHub Actions runner minutes.
on:
  schedule:
    - cron: "17 21 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["countries/**", "argos/**", "themes.yaml", ".github/workflows/daily.yml"]

concurrency:
  group: daily-digest
  cancel-in-progress: false

env:
  ARGOS_DATA_DIR: ${{ github.workspace }}/.argos-data
  ARGOS_EXTRACT_STORY_ONLY: "1"
  ARGOS_EXTRACT_LIMIT: "400"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      # The database is kept between runs, so each run only reads what is new.
      - name: Restore database
        uses: actions/cache/restore@v4
        with:
          path: .argos-data/argos.db
          key: argos-db-${{ github.run_id }}
          restore-keys: argos-db-

      - name: Restore embedding model
        id: model
        uses: actions/cache@v4
        with:
          path: .argos-data/models
          key: e5-small-onnx-v1

      - name: Download embedding model (first run only)
        if: steps.model.outputs.cache-hit != 'true'
        run: |
          mkdir -p .argos-data/models/multilingual-e5-small
          base=https://huggingface.co/intfloat/multilingual-e5-small/resolve/main/onnx
          curl -fL -o .argos-data/models/multilingual-e5-small/model.onnx "$base/model.onnx"
          curl -fL -o .argos-data/models/multilingual-e5-small/tokenizer.json "$base/tokenizer.json"

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: hf-marian-models-v1
          restore-keys: hf-marian-models-

      - name: Collect, analyse and export
        run: python run.py ingest normalise relevance embed cluster classify policy rank extract excerpts verify translate export crisis trends reddit social watch prune report

      - name: Save database
        uses: actions/cache/save@v4
        if: always()
        with:
          path: .argos-data/argos.db
          key: argos-db-${{ github.run_id }}

      - name: Save site data cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: site/data
          key: site-data-${{ github.run_id }}

      # Needs two repository secrets (Settings > Secrets and variables > Actions):
      # CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
      - name: Create the Pages project (first run only; harmless if it exists)
        run: npx --yes wrangler@4 pages project create argos-monitor --production-branch=main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Publish to Cloudflare Pages
        run: |
          git pull origin main || true
          npx --yes wrangler@4 pages deploy site --project-name=argos-monitor --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
