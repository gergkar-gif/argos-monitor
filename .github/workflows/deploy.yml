name: Fast Site Deploy

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: true

env:
  ARGOS_DATA_DIR: ${{ github.workspace }}/.argos-data

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # Restore the site data cache generated by the daily digest
      - name: Restore site data cache
        id: data-cache
        uses: actions/cache/restore@v4
        with:
          path: site/data
          key: site-data-${{ github.run_id }}
          restore-keys: site-data-

      # If site data cache was missing, restore DB and quickly run export (takes ~20s)
      - name: Restore database (fallback)
        if: steps.data-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: .argos-data/argos.db
          key: argos-db-${{ github.run_id }}
          restore-keys: argos-db-

      - name: Generate site data from database (fallback)
        if: steps.data-cache.outputs.cache-hit != 'true'
        run: |
          pip install -r requirements.txt
          mkdir -p site/data
          if [ -f .argos-data/argos.db ]; then
            python run.py export crisis trends reddit social watch report
          else
            echo "Database cache not yet available; skipping export"
          fi

      # Fast publish directly to Cloudflare Pages
      - name: Publish to Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy site --project-name=argos-monitor --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
