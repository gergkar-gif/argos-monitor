name: Live Alerts (0-24h)

# Lightweight 0-24h alert updater: runs only `python run.py crisis` every 2 hours around the clock
# (no SQLite database or ML models required, finishes in <45 seconds) and deploys updated alerts to Cloudflare Pages.
on:
  schedule:
    - cron: "12 */2 * * *"
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: true

env:
  ARGOS_DATA_DIR: ${{ github.workspace }}/.argos-data

jobs:
  alerts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Restore site data cache
        uses: actions/cache/restore@v4
        with:
          path: site/data
          key: site-data-${{ github.run_id }}
          restore-keys: site-data-

      - name: Update 0-24h crisis & official alerts
        run: |
          pip install -r requirements.txt
          mkdir -p site/data
          if [ ! -f site/data/index.json ]; then
            python run.py export watch || true
          fi
          python run.py crisis

      - name: Save updated site data cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: site/data
          key: site-data-${{ github.run_id }}

      - name: Publish to Cloudflare Pages
        run: |
          npx --yes wrangler@4 pages deploy site --project-name=argos-monitor --branch=main || \
            (sleep 10 && npx --yes wrangler@4 pages deploy site --project-name=argos-monitor --branch=main) || \
            (sleep 20 && npx --yes wrangler@4 pages deploy site --project-name=argos-monitor --branch=main)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
